en:{title:'Support',label:'Language',updated:'Last updated:',privacy:'Privacy Policy',terms:'Terms of Use',html:`<p>Need help with Truth or Dare? Contact NV Softlab:</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Email support</a></p><p>Include your device model, OS and App versions, and what happened. Screenshots help. Never send passwords or payment-card details.</p></div><h2>Purchases and subscriptions</h2><ul><li>Open Settings in the App and choose Restore Purchases.</li><li>Manage or cancel in Apple Settings → your name → Subscriptions, or Google Play → profile → Payments &amp; subscriptions.</li><li>Deleting the App does not cancel a subscription. Refund decisions are made by Apple or Google.</li></ul><h2>Common questions</h2><ul><li>If Pro is missing, confirm the subscription is active, use the same store account, reopen the App, then restore purchases.</li><li>Custom decks are kept locally and may be lost if you delete the App or clear its data.</li><li>Change language under Settings → Language.</li><li>If the App is slow or stuck, fully close it, restart the device, update the App, then email us with steps to reproduce.</li></ul><h2>Safety</h2><p>The App is only for consenting adults aged 18+. Anyone may skip any card or stop. Never do anything illegal, unsafe, harmful, or unwanted.</p>`},
de:{title:'Support',label:'Sprache',updated:'Zuletzt aktualisiert:',privacy:'Datenschutzerklärung',terms:'Nutzungsbedingungen',html:`<p>Hilfe zu Truth or Dare:</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Support mailen</a></p><p>Nenne Gerätemodell, OS- und App-Version und beschreibe das Problem. Screenshots helfen. Sende nie Passwörter oder Kartendaten.</p></div><h2>Käufe und Abos</h2><ul><li>Wähle in den App-Einstellungen „Käufe wiederherstellen“.</li><li>Verwalte oder kündige unter Apple Einstellungen → dein Name → Abonnements oder Google Play → Profil → Zahlungen &amp; Abos.</li><li>Das Löschen der App kündigt nicht. Über Erstattungen entscheidet Apple oder Google.</li></ul><h2>Häufige Fragen</h2><ul><li>Fehlt Pro, prüfe das aktive Abo und Store-Konto, öffne neu und stelle Käufe wieder her.</li><li>Eigene Decks bleiben lokal und können beim Löschen der App/Daten verloren gehen.</li><li>Sprache: Einstellungen → Sprache.</li><li>Bei Problemen App schließen, Gerät neu starten, aktualisieren und Schritte mailen.</li></ul><h2>Sicherheit</h2><p>Nur für einvernehmende Erwachsene ab 18. Alle dürfen Karten überspringen oder stoppen. Tue nie etwas Illegales, Unsicheres, Schädliches oder Unerwünschtes.</p>`},
es:{title:'Soporte',label:'Idioma',updated:'Última actualización:',privacy:'Política de Privacidad',terms:'Términos de Uso',html:`<p>¿Necesitas ayuda con Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Enviar correo</a></p><p>Incluye modelo, versiones del sistema y App y lo ocurrido. Las capturas ayudan. No envíes contraseñas ni datos de tarjeta.</p></div><h2>Compras y suscripciones</h2><ul><li>En Ajustes de la App elige Restaurar compras.</li><li>Gestiona o cancela en Ajustes de Apple → tu nombre → Suscripciones o Google Play → perfil → Pagos y suscripciones.</li><li>Borrar la App no cancela. Apple o Google decide reembolsos.</li></ul><h2>Preguntas comunes</h2><ul><li>Si falta Pro, confirma la suscripción y cuenta de tienda, reabre y restaura.</li><li>Las barajas propias son locales y pueden perderse al borrar la App o sus datos.</li><li>Cambia idioma en Ajustes → Idioma.</li><li>Si falla, cierra, reinicia, actualiza y envíanos los pasos.</li></ul><h2>Seguridad</h2><p>Solo para adultos de 18+ que consienten. Cualquiera puede saltar o parar. Nunca hagas nada ilegal, inseguro, dañino o no deseado.</p>`},
fr:{title:'Assistance',label:'Langue',updated:'Dernière mise à jour :',privacy:'Politique de Confidentialité',terms:'Conditions d’Utilisation',html:`<p>Besoin d’aide avec Truth or Dare ?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Écrire au support</a></p><p>Indiquez appareil, versions OS et App et le problème. Les captures aident. N’envoyez jamais mots de passe ou carte bancaire.</p></div><h2>Achats et abonnements</h2><ul><li>Dans les réglages de l’App, choisissez Restaurer les achats.</li><li>Gérez ou annulez dans Réglages Apple → votre nom → Abonnements ou Google Play → profil → Paiements et abonnements.</li><li>Supprimer l’App n’annule pas. Apple ou Google décide des remboursements.</li></ul><h2>Questions fréquentes</h2><ul><li>Si Pro manque, vérifiez abonnement et compte, relancez puis restaurez.</li><li>Les paquets créés restent locaux et peuvent disparaître avec l’App/ses données.</li><li>Langue : Réglages → Langue.</li><li>En cas de blocage, fermez, redémarrez, mettez à jour et envoyez les étapes.</li></ul><h2>Sécurité</h2><p>Réservé aux adultes consentants de 18+. Chacun peut passer ou arrêter. Ne faites rien d’illégal, dangereux, nuisible ou non désiré.</p>`},
pl:{title:'Pomoc',label:'Język',updated:'Ostatnia aktualizacja:',privacy:'Polityka Prywatności',terms:'Warunki Użytkowania',html:`<p>Potrzebujesz pomocy z Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Napisz do pomocy</a></p><p>Podaj model urządzenia, wersje systemu i Aplikacji oraz opis. Zrzuty pomagają. Nie wysyłaj haseł ani danych karty.</p></div><h2>Zakupy i subskrypcje</h2><ul><li>W Ustawieniach Aplikacji wybierz Przywróć zakupy.</li><li>Zarządzaj lub anuluj: Ustawienia Apple → Twoje imię → Subskrypcje albo Google Play → profil → Płatności i subskrypcje.</li><li>Usunięcie Aplikacji nie anuluje. Zwroty rozstrzyga Apple lub Google.</li></ul><h2>Częste pytania</h2><ul><li>Gdy brak Pro, sprawdź aktywną subskrypcję i konto sklepu, uruchom ponownie i przywróć.</li><li>Własne talie są lokalne i mogą zniknąć po usunięciu Aplikacji/danych.</li><li>Język zmienisz w Ustawienia → Język.</li><li>Przy problemie zamknij, uruchom ponownie, zaktualizuj i wyślij kroki.</li></ul><h2>Bezpieczeństwo</h2><p>Tylko dla dorosłych 18+ uczestniczących za zgodą. Każdy może pominąć lub przerwać. Nigdy nie rób nic nielegalnego, niebezpiecznego, szkodliwego ani niechcianego.</p>`},
uk:{title:'Підтримка',label:'Мова',updated:'Останнє оновлення:',privacy:'Політика конфіденційності',terms:'Умови використання',html:`<p>Потрібна допомога з Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Написати підтримці</a></p><p>Вкажіть модель, версії ОС і Застосунку та опишіть проблему. Скриншоти допоможуть. Не надсилайте паролі чи дані картки.</p></div><h2>Покупки й підписки</h2><ul><li>У Налаштуваннях Застосунку виберіть Відновити покупки.</li><li>Керуйте чи скасовуйте в Налаштування Apple → ваше ім’я → Підписки або Google Play → профіль → Платежі й підписки.</li><li>Видалення Застосунку не скасовує. Повернення вирішує Apple або Google.</li></ul><h2>Поширені питання</h2><ul><li>Якщо немає Pro, перевірте підписку й акаунт магазину, перезапустіть і відновіть.</li><li>Власні колоди локальні й можуть зникнути після видалення Застосунку/даних.</li><li>Мова: Налаштування → Мова.</li><li>При зависанні закрийте, перезапустіть, оновіть і надішліть кроки.</li></ul><h2>Безпека</h2><p>Лише для повнолітніх 18+ за взаємною згодою. Кожен може пропустити чи зупинитися. Не робіть нічого незаконного, небезпечного, шкідливого чи небажаного.</p>`},
pt:{title:'Apoio',label:'Idioma',updated:'Última atualização:',privacy:'Política de Privacidade',terms:'Termos de Utilização',html:`<p>Precisa de ajuda com Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Enviar e-mail</a></p><p>Inclua dispositivo, versões do sistema e Aplicação e o sucedido. Capturas ajudam. Não envie palavras-passe ou dados do cartão.</p></div><h2>Compras e subscrições</h2><ul><li>Nas Definições da Aplicação escolha Restaurar compras.</li><li>Gira ou cancele nas definições Apple → nome → Subscrições ou Google Play → perfil → Pagamentos e subscrições.</li><li>Eliminar a Aplicação não cancela. Apple ou Google decide reembolsos.</li></ul><h2>Perguntas comuns</h2><ul><li>Se faltar Pro, confirme subscrição e conta, reabra e restaure.</li><li>Baralhos próprios são locais e podem perder-se ao eliminar a Aplicação/dados.</li><li>Idioma: Definições → Idioma.</li><li>Se bloquear, feche, reinicie, atualize e envie os passos.</li></ul><h2>Segurança</h2><p>Só para adultos 18+ com consentimento. Todos podem passar ou parar. Nunca faça algo ilegal, inseguro, nocivo ou indesejado.</p>`},
pt_BR:{title:'Suporte',label:'Idioma',updated:'Última atualização:',privacy:'Política de Privacidade',terms:'Termos de Uso',html:`<p>Precisa de ajuda com Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Enviar e-mail</a></p><p>Informe aparelho, versões do sistema e Aplicativo e o ocorrido. Capturas ajudam. Não envie senhas ou dados do cartão.</p></div><h2>Compras e assinaturas</h2><ul><li>Nos Ajustes do Aplicativo escolha Restaurar compras.</li><li>Gerencie ou cancele em Ajustes Apple → nome → Assinaturas ou Google Play → perfil → Pagamentos e assinaturas.</li><li>Excluir o Aplicativo não cancela. Apple ou Google decide reembolsos.</li></ul><h2>Perguntas comuns</h2><ul><li>Se faltar Pro, confirme assinatura e conta, reabra e restaure.</li><li>Baralhos próprios são locais e podem sumir ao excluir o Aplicativo/dados.</li><li>Idioma: Ajustes → Idioma.</li><li>Se travar, feche, reinicie, atualize e envie os passos.</li></ul><h2>Segurança</h2><p>Somente para adultos 18+ que consentem. Todos podem pular ou parar. Nunca faça algo ilegal, inseguro, nocivo ou indesejado.</p>`},
hu:{title:'Támogatás',label:'Nyelv',updated:'Utolsó frissítés:',privacy:'Adatvédelmi szabályzat',terms:'Felhasználási feltételek',html:`<p>Segítség kell a Truth or Dare-hez?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">E-mail a támogatásnak</a></p><p>Írd meg az eszközt, OS- és App-verziót és a történteket. Képernyőkép segít. Jelszót vagy kártyaadatot ne küldj.</p></div><h2>Vásárlás és előfizetés</h2><ul><li>Az Alkalmazás Beállításaiban válaszd a Vásárlások visszaállítását.</li><li>Kezelés/lemondás: Apple Beállítások → név → Előfizetések vagy Google Play → profil → Fizetések és előfizetések.</li><li>Az Alkalmazás törlése nem mondja le. Visszatérítésről Apple vagy Google dönt.</li></ul><h2>Gyakori kérdések</h2><ul><li>Hiányzó Pro esetén ellenőrizd az előfizetést és fiókot, nyisd újra és állítsd vissza.</li><li>Saját paklik helyben vannak és törléskor elveszhetnek.</li><li>Nyelv: Beállítások → Nyelv.</li><li>Hibánál zárd be, indítsd újra, frissítsd és küldd el a lépéseket.</li></ul><h2>Biztonság</h2><p>Csak 18+ beleegyező felnőtteknek. Bárki kihagyhat vagy leállhat. Ne tegyél jogellenes, veszélyes, káros vagy nem kívánt dolgot.</p>`},
id:{title:'Dukungan',label:'Bahasa',updated:'Terakhir diperbarui:',privacy:'Kebijakan Privasi',terms:'Ketentuan Penggunaan',html:`<p>Perlu bantuan dengan Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Email dukungan</a></p><p>Sertakan perangkat, versi OS dan Aplikasi, serta masalah. Tangkapan layar membantu. Jangan kirim sandi atau data kartu.</p></div><h2>Pembelian dan langganan</h2><ul><li>Di Pengaturan Aplikasi pilih Pulihkan Pembelian.</li><li>Kelola/batalkan di Pengaturan Apple → nama → Langganan atau Google Play → profil → Pembayaran &amp; langganan.</li><li>Menghapus Aplikasi tidak membatalkan. Apple atau Google memutuskan pengembalian.</li></ul><h2>Pertanyaan umum</h2><ul><li>Jika Pro hilang, periksa langganan dan akun toko, buka ulang, lalu pulihkan.</li><li>Dek buatan bersifat lokal dan bisa hilang saat Aplikasi/data dihapus.</li><li>Bahasa: Pengaturan → Bahasa.</li><li>Jika macet, tutup, mulai ulang, perbarui, dan kirim langkahnya.</li></ul><h2>Keselamatan</h2><p>Hanya untuk dewasa 18+ yang saling setuju. Siapa pun boleh melewati atau berhenti. Jangan lakukan hal ilegal, tidak aman, berbahaya, atau tak diinginkan.</p>`},
it:{title:'Assistenza',label:'Lingua',updated:'Ultimo aggiornamento:',privacy:'Informativa sulla Privacy',terms:'Termini di Utilizzo',html:`<p>Serve aiuto con Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Invia e-mail</a></p><p>Indica dispositivo, versioni OS e App e problema. Gli screenshot aiutano. Non inviare password o dati della carta.</p></div><h2>Acquisti e abbonamenti</h2><ul><li>Nelle Impostazioni dell’App scegli Ripristina acquisti.</li><li>Gestisci/annulla in Impostazioni Apple → nome → Abbonamenti o Google Play → profilo → Pagamenti e abbonamenti.</li><li>Eliminare l’App non annulla. Apple o Google decide i rimborsi.</li></ul><h2>Domande comuni</h2><ul><li>Se manca Pro, verifica abbonamento e account, riapri e ripristina.</li><li>I mazzi creati sono locali e possono perdersi eliminando App/dati.</li><li>Lingua: Impostazioni → Lingua.</li><li>Se si blocca, chiudi, riavvia, aggiorna e invia i passaggi.</li></ul><h2>Sicurezza</h2><p>Solo per adulti 18+ consenzienti. Chiunque può saltare o fermarsi. Non fare mai qualcosa di illegale, pericoloso, dannoso o indesiderato.</p>`},
ro:{title:'Asistență',label:'Limbă',updated:'Ultima actualizare:',privacy:'Politica de Confidențialitate',terms:'Termeni de Utilizare',html:`<p>Aveți nevoie de ajutor cu Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Trimiteți e-mail</a></p><p>Includeți dispozitivul, versiunile SO și Aplicație și problema. Capturile ajută. Nu trimiteți parole sau date de card.</p></div><h2>Achiziții și abonamente</h2><ul><li>În Setările Aplicației alegeți Restabilire achiziții.</li><li>Gestionați/anulați în Setări Apple → nume → Abonamente sau Google Play → profil → Plăți și abonamente.</li><li>Ștergerea Aplicației nu anulează. Apple sau Google decide rambursările.</li></ul><h2>Întrebări frecvente</h2><ul><li>Dacă lipsește Pro, verificați abonamentul și contul, redeschideți și restabiliți.</li><li>Pachetele proprii sunt locale și se pot pierde la ștergerea Aplicației/datelor.</li><li>Limbă: Setări → Limbă.</li><li>Dacă se blochează, închideți, reporniți, actualizați și trimiteți pașii.</li></ul><h2>Siguranță</h2><p>Doar pentru adulți 18+ care consimt. Oricine poate sări sau opri. Nu faceți ceva ilegal, nesigur, dăunător sau nedorit.</p>`},
nl:{title:'Ondersteuning',label:'Taal',updated:'Laatst bijgewerkt:',privacy:'Privacybeleid',terms:'Gebruiksvoorwaarden',html:`<p>Hulp nodig met Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">E-mail support</a></p><p>Noem apparaat, OS- en App-versie en probleem. Screenshots helpen. Stuur geen wachtwoorden of kaartgegevens.</p></div><h2>Aankopen en abonnementen</h2><ul><li>Kies Aankopen herstellen in App-instellingen.</li><li>Beheer/annuleer in Apple Instellingen → naam → Abonnementen of Google Play → profiel → Betalingen en abonnementen.</li><li>Verwijderen van de App annuleert niet. Apple of Google beslist terugbetaling.</li></ul><h2>Veelgestelde vragen</h2><ul><li>Ontbreekt Pro, controleer abonnement en account, heropen en herstel.</li><li>Eigen decks zijn lokaal en kunnen verloren gaan bij wissen App/gegevens.</li><li>Taal: Instellingen → Taal.</li><li>Bij vastlopen: sluit, herstart, update en mail de stappen.</li></ul><h2>Veiligheid</h2><p>Alleen voor instemmende volwassenen van 18+. Iedereen mag overslaan of stoppen. Doe nooit iets illegaals, onveiligs, schadelijks of ongewensts.</p>`},
tr:{title:'Destek',label:'Dil',updated:'Son güncelleme:',privacy:'Gizlilik Politikası',terms:'Kullanım Koşulları',html:`<p>Truth or Dare için yardım mı gerekiyor?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Desteğe e-posta</a></p><p>Cihaz, OS ve Uygulama sürümünü ve sorunu yazın. Ekran görüntüsü yardımcı olur. Şifre veya kart bilgisi göndermeyin.</p></div><h2>Satın alma ve abonelik</h2><ul><li>Uygulama Ayarlarından Satın Alımları Geri Yükle’yi seçin.</li><li>Apple Ayarlar → ad → Abonelikler veya Google Play → profil → Ödemeler ve aboneliklerden yönetin/iptal edin.</li><li>Uygulamayı silmek iptal etmez. İadeye Apple veya Google karar verir.</li></ul><h2>Sık sorular</h2><ul><li>Pro yoksa abonelik ve hesabı doğrulayın, yeniden açıp geri yükleyin.</li><li>Özel desteler yereldir ve Uygulama/veriler silinince kaybolabilir.</li><li>Dil: Ayarlar → Dil.</li><li>Takılırsa kapatın, yeniden başlatın, güncelleyin ve adımları gönderin.</li></ul><h2>Güvenlik</h2><p>Yalnızca karşılıklı onay veren 18+ yetişkinler için. Herkes geçebilir veya durabilir. Yasa dışı, güvensiz, zararlı veya istenmeyen bir şey yapmayın.</p>`},
cs:{title:'Podpora',label:'Jazyk',updated:'Poslední aktualizace:',privacy:'Zásady ochrany osobních údajů',terms:'Podmínky používání',html:`<p>Potřebujete pomoc s Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Napsat podpoře</a></p><p>Uveďte zařízení, verze OS a Aplikace a problém. Snímky pomohou. Neposílejte hesla ani údaje karty.</p></div><h2>Nákupy a předplatné</h2><ul><li>V Nastavení Aplikace zvolte Obnovit nákupy.</li><li>Správa/zrušení: Apple Nastavení → jméno → Předplatná nebo Google Play → profil → Platby a předplatná.</li><li>Smazání Aplikace nezruší. O vrácení rozhoduje Apple či Google.</li></ul><h2>Časté otázky</h2><ul><li>Chybí-li Pro, ověřte předplatné a účet, otevřete znovu a obnovte.</li><li>Vlastní balíčky jsou lokální a mohou zmizet při smazání Aplikace/dat.</li><li>Jazyk: Nastavení → Jazyk.</li><li>Při zaseknutí zavřete, restartujte, aktualizujte a pošlete kroky.</li></ul><h2>Bezpečnost</h2><p>Jen pro souhlasící dospělé 18+. Každý může přeskočit nebo skončit. Nedělejte nic nezákonného, nebezpečného, škodlivého nebo nechtěného.</p>`},
sv:{title:'Support',label:'Språk',updated:'Senast uppdaterad:',privacy:'Integritetspolicy',terms:'Användarvillkor',html:`<p>Behöver du hjälp med Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Mejla support</a></p><p>Ange enhet, OS- och App-version och problemet. Skärmbilder hjälper. Skicka inte lösenord eller kortuppgifter.</p></div><h2>Köp och prenumerationer</h2><ul><li>Välj Återställ köp i Appens inställningar.</li><li>Hantera/avsluta i Apple Inställningar → namn → Prenumerationer eller Google Play → profil → Betalningar och prenumerationer.</li><li>Radering av Appen avslutar inte. Apple eller Google beslutar återbetalning.</li></ul><h2>Vanliga frågor</h2><ul><li>Saknas Pro, kontrollera prenumeration och konto, öppna igen och återställ.</li><li>Egna kortlekar är lokala och kan förloras när App/data raderas.</li><li>Språk: Inställningar → Språk.</li><li>Vid problem: stäng, starta om, uppdatera och mejla stegen.</li></ul><h2>Säkerhet</h2><p>Endast för samtyckande vuxna 18+. Alla kan hoppa över eller sluta. Gör inget olagligt, osäkert, skadligt eller oönskat.</p>`},
ru:{title:'Поддержка',label:'Язык',updated:'Последнее обновление:',privacy:'Политика конфиденциальности',terms:'Условия использования',html:`<p>Нужна помощь с Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Написать поддержке</a></p><p>Укажите устройство, версии ОС и Приложения и проблему. Скриншоты помогут. Не отправляйте пароли или данные карты.</p></div><h2>Покупки и подписки</h2><ul><li>В Настройках Приложения выберите Восстановить покупки.</li><li>Управляйте/отменяйте в Настройки Apple → имя → Подписки или Google Play → профиль → Платежи и подписки.</li><li>Удаление Приложения не отменяет. Возврат решает Apple или Google.</li></ul><h2>Частые вопросы</h2><ul><li>Если нет Pro, проверьте подписку и аккаунт, откройте снова и восстановите.</li><li>Собственные колоды локальны и могут исчезнуть при удалении Приложения/данных.</li><li>Язык: Настройки → Язык.</li><li>При зависании закройте, перезапустите, обновите и пришлите шаги.</li></ul><h2>Безопасность</h2><p>Только для согласных взрослых 18+. Любой может пропустить или остановиться. Не делайте ничего незаконного, опасного, вредного или нежелательного.</p>`},
da:{title:'Support',label:'Sprog',updated:'Senest opdateret:',privacy:'Privatlivspolitik',terms:'Brugsvilkår',html:`<p>Brug for hjælp til Truth or Dare?</p><div class="card"><p><a class="button" href="mailto:nvsoftlab@gmail.com?subject=Truth%20or%20Dare%20Support">Send e-mail</a></p><p>Angiv enhed, OS- og App-version og problemet. Skærmbilleder hjælper. Send ikke adgangskoder eller kortoplysninger.</p></div><h2>Køb og abonnementer</h2><ul><li>Vælg Gendan køb i Appens indstillinger.</li><li>Administrer/annuller i Apple Indstillinger → navn → Abonnementer eller Google Play → profil → Betalinger og abonnementer.</li><li>Sletning af Appen annullerer ikke. Apple eller Google afgør refusion.</li></ul><h2>Ofte stillede spørgsmål</h2><ul><li>Mangler Pro, kontrollér abonnement og konto, åbn igen og gendan.</li><li>Egne kortsæt er lokale og kan mistes ved sletning af App/data.</li><li>Sprog: Indstillinger → Sprog.</li><li>Ved stop: luk, genstart, opdater og send trinene.</li></ul><h2>Sikkerhed</h2><p>Kun for samtykkende voksne 18+. Alle kan springe over eller stoppe. Gør intet ulovligt, usikkert, skadeligt eller uønsket.</p>`}

const select=document.getElementById('language');Object.entries(languages).forEach(([k,v])=>select.add(new Option(v,k)));function locale(){const q=new URLSearchParams(location.search).get('lang');if(copy[q])return q;const raw=(navigator.language||'en').replace('-','_');return copy[raw]?raw:(copy[raw.split('_')[0]]?raw.split('_')[0]:'en')}function show(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang.replace('_','-');document.title=`${c.title} — Truth or Dare`;document.getElementById('title').textContent=c.title;document.getElementById('language-label').textContent=c.label;document.getElementById('updated-label').textContent=c.updated;document.getElementById('content').innerHTML=c.html;const privacy=document.getElementById('privacy');const terms=document.getElementById('terms');privacy.textContent=c.privacy;terms.textContent=c.terms;privacy.href=`../privacy-policy/?lang=${encodeURIComponent(lang)}`;terms.href=`../terms-of-use/?lang=${encodeURIComponent(lang)}`;select.value=lang;const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState({},'',u)}select.addEventListener('change',()=>show(select.value));show(locale());
