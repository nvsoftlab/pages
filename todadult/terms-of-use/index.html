en:{title:'Terms of Use',label:'Language',date:'Effective date:',privacy:'Privacy Policy',support:'Support',html:`<p>These Terms govern your use of the <strong>Truth or Dare</strong> mobile app (“App”) provided by JDG Nazar Dzys, trading as NV Softlab. By using the App, you agree to them.</p><h2>1. Adults only</h2><p>You must be at least 18. The App contains mature themes and is an entertainment game for consenting adults.</p><h2>2. Consent and safety</h2><p>Every question or dare is optional. Respect boundaries; anyone may skip or stop. Never perform anything illegal, unsafe, harmful, humiliating, coerced, or unwanted, and do not use the App while driving. You are responsible for your choices and surroundings.</p><h2>3. Subscriptions</h2><p>The App may offer weekly and annual auto-renewing plans. Current price, period, trial (if any), and benefits appear before purchase. Payment is charged through Apple or Google. A plan renews unless cancelled at least 24 hours before the period ends; renewal may be charged within those 24 hours. Manage or cancel it in your store account. Deleting the App does not cancel it. Store rules and consumer law govern refunds. Restore eligible purchases in the App.</p><h2>4. Content and acceptable use</h2><p>NV Softlab or its licensors own the App and built-in content and grant you a personal, revocable, non-transferable licence for private entertainment. You own lawful original custom content you write; it remains local to your device. Do not harass, coerce, exploit, infringe rights, bypass security or payment controls, reverse engineer except where law permits, resell the App, or distribute built-in content.</p><h2>5. Availability, warranty, and liability</h2><p>We may change or discontinue features for product, security, service, or legal reasons, subject to mandatory consumer rights. The App is provided “as is” and “as available”. To the extent allowed by law, we exclude implied warranties and indirect or consequential losses. We do not exclude rights or liability that law does not allow us to exclude.</p><h2>6. Ending use, law, and changes</h2><p>You may stop at any time. We may restrict access for fraud, misuse, security risks, or breach. Polish law governs these Terms and Wrocław courts have jurisdiction, except where mandatory consumer law gives you protections elsewhere. Updates will appear here; material changes receive notice where required.</p><h2>7. Privacy and contact</h2><p>See our <a href="../privacy-policy/">Privacy Policy</a>. Questions: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
de:{title:'Nutzungsbedingungen',label:'Sprache',date:'Gültig ab:',privacy:'Datenschutzerklärung',support:'Support',html:`<p>Diese Bedingungen regeln die Nutzung der von JDG Nazar Dzys unter NV Softlab angebotenen App <strong>Truth or Dare</strong>. Mit der Nutzung stimmst du ihnen zu.</p><h2>1. Nur Erwachsene</h2><p>Du musst mindestens 18 sein. Die App enthält reife Themen und ist Unterhaltung für einvernehmende Erwachsene.</p><h2>2. Einwilligung und Sicherheit</h2><p>Jede Frage und Aufgabe ist freiwillig. Grenzen sind zu respektieren; alle dürfen überspringen oder aufhören. Tue nichts Illegales, Unsicheres, Schädliches, Erniedrigendes, Erzwungenes oder Unerwünschtes und nutze die App nicht beim Fahren. Du trägst Verantwortung für Entscheidungen und Umgebung.</p><h2>3. Abonnements</h2><p>Es kann automatisch verlängernde Wochen- und Jahrespläne geben. Preis, Zeitraum, etwaige Probezeit und Vorteile stehen vor dem Kauf. Apple oder Google belastet dein Konto. Kündige mindestens 24 Stunden vor Periodenende; Löschen der App kündigt nicht. Rückerstattungen richten sich nach Store-Regeln und Verbraucherrecht. Berechtigte Käufe können in der App wiederhergestellt werden.</p><h2>4. Inhalte und Nutzung</h2><p>NV Softlab oder Lizenzgeber besitzen App und integrierte Inhalte; du erhältst eine persönliche, widerrufliche Lizenz zur privaten Unterhaltung. Rechtmäßige eigene Inhalte gehören dir und bleiben lokal. Keine Belästigung, Nötigung, Rechtsverletzung, Umgehung von Sicherheit/Zahlung, unerlaubte Rückentwicklung, Weiterveräußerung oder Verbreitung integrierter Inhalte.</p><h2>5. Verfügbarkeit und Haftung</h2><p>Wir dürfen Funktionen aus Produkt-, Sicherheits-, Dienst- oder Rechtsgründen ändern, vorbehaltlich zwingender Verbraucherrechte. Die App wird „wie besehen“ bereitgestellt. Soweit zulässig, haften wir nicht für indirekte Folgeschäden; unabdingbare Rechte und Haftung bleiben bestehen.</p><h2>6. Ende, Recht, Datenschutz</h2><p>Wir dürfen Zugang bei Betrug, Missbrauch, Risiko oder Verstoß beschränken. Polnisches Recht und Gerichte in Wrocław gelten, soweit zwingendes Verbraucherrecht nichts anderes vorsieht. Änderungen stehen hier. Siehe <a href="../privacy-policy/">Datenschutzerklärung</a>. Kontakt: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
es:{title:'Términos de Uso',label:'Idioma',date:'Fecha de vigencia:',privacy:'Política de Privacidad',support:'Soporte',html:`<p>Estos Términos rigen el uso de <strong>Truth or Dare</strong>, ofrecida por JDG Nazar Dzys bajo NV Softlab. Al usarla, los aceptas.</p><h2>1. Solo adultos</h2><p>Debes tener 18 años o más. La App contiene temas maduros y es entretenimiento para adultos que consienten.</p><h2>2. Consentimiento y seguridad</h2><p>Toda pregunta o reto es opcional. Respeta límites; cualquiera puede saltar o parar. No hagas nada ilegal, inseguro, dañino, humillante, coaccionado o no deseado ni uses la App al conducir. Eres responsable de tus decisiones y entorno.</p><h2>3. Suscripciones</h2><p>Puede haber planes semanales y anuales autorrenovables. Precio, periodo, prueba y beneficios se muestran antes de comprar. Apple o Google cobra el pago. Cancela al menos 24 horas antes del final; borrar la App no cancela. Los reembolsos siguen las reglas de la tienda y la ley. Restaura compras válidas en la App.</p><h2>4. Contenido y uso</h2><p>NV Softlab o sus licenciantes poseen la App y su contenido integrado; recibes una licencia personal y revocable para entretenimiento privado. Conservas tus contenidos originales lícitos, que quedan locales. No acoses, coacciones, infrinjas derechos, eludas seguridad o pagos, realices ingeniería inversa salvo permiso legal, revendas ni distribuyas el contenido integrado.</p><h2>5. Disponibilidad y responsabilidad</h2><p>Podemos cambiar funciones por razones de producto, seguridad, servicio o ley, respetando derechos obligatorios. La App se ofrece “tal cual”. En la medida legal, excluimos garantías implícitas y daños indirectos; no excluimos derechos o responsabilidad irrenunciables.</p><h2>6. Finalización, ley y privacidad</h2><p>Podemos restringir acceso por fraude, abuso, riesgo o incumplimiento. Rigen la ley polaca y los tribunales de Wrocław salvo protección obligatoria del consumidor. Los cambios aparecerán aquí. Consulta la <a href="../privacy-policy/">Política de Privacidad</a>. Contacto: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
fr:{title:'Conditions d’Utilisation',label:'Langue',date:'Date d’effet :',privacy:'Politique de Confidentialité',support:'Assistance',html:`<p>Ces Conditions régissent l’utilisation de <strong>Truth or Dare</strong>, fournie par JDG Nazar Dzys sous le nom NV Softlab. En l’utilisant, vous les acceptez.</p><h2>1. Adultes uniquement</h2><p>Vous devez avoir au moins 18 ans. L’App contient des thèmes adultes et divertit des adultes consentants.</p><h2>2. Consentement et sécurité</h2><p>Chaque question ou défi est facultatif. Respectez les limites ; chacun peut passer ou arrêter. Ne faites rien d’illégal, dangereux, nuisible, humiliant, forcé ou non désiré et n’utilisez pas l’App au volant. Vous êtes responsable de vos choix et de votre environnement.</p><h2>3. Abonnements</h2><p>Des formules hebdomadaires et annuelles renouvelables peuvent être proposées. Prix, période, essai éventuel et avantages s’affichent avant achat. Apple ou Google facture. Annulez au moins 24 h avant la fin ; supprimer l’App n’annule pas. Les remboursements suivent les règles de la boutique et le droit. Restaurez les achats éligibles dans l’App.</p><h2>4. Contenu et usage</h2><p>NV Softlab ou ses concédants possèdent l’App et son contenu intégré ; vous recevez une licence personnelle révocable pour le divertissement privé. Vos créations originales licites restent à vous et en local. Interdiction de harceler, contraindre, violer des droits, contourner sécurité ou paiement, désassembler sauf autorisation légale, revendre ou distribuer le contenu intégré.</p><h2>5. Disponibilité et responsabilité</h2><p>Nous pouvons modifier des fonctions pour raisons de produit, sécurité, service ou droit, sous réserve des droits impératifs. L’App est fournie « en l’état ». Dans la limite légale, garanties implicites et dommages indirects sont exclus, jamais les droits ou responsabilités non excluables.</p><h2>6. Fin, droit et vie privée</h2><p>Nous pouvons limiter l’accès pour fraude, abus, risque ou violation. Le droit polonais et les tribunaux de Wrocław s’appliquent sauf protection impérative du consommateur. Les changements paraîtront ici. Voir la <a href="../privacy-policy/">Politique de Confidentialité</a>. Contact : <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
pl:{title:'Warunki Użytkowania',label:'Język',date:'Data wejścia w życie:',privacy:'Polityka Prywatności',support:'Pomoc',html:`<p>Te Warunki regulują korzystanie z <strong>Truth or Dare</strong>, oferowanej przez JDG Nazar Dzys jako NV Softlab. Korzystając, akceptujesz je.</p><h2>1. Tylko dorośli</h2><p>Musisz mieć co najmniej 18 lat. Aplikacja zawiera dojrzałe treści i służy rozrywce dorosłych uczestniczących za zgodą.</p><h2>2. Zgoda i bezpieczeństwo</h2><p>Każde pytanie i wyzwanie jest dobrowolne. Szanuj granice; każdy może pominąć lub przerwać. Nie rób nic nielegalnego, niebezpiecznego, szkodliwego, upokarzającego, wymuszonego ani niechcianego i nie używaj Aplikacji podczas jazdy. Odpowiadasz za wybory i otoczenie.</p><h2>3. Subskrypcje</h2><p>Mogą być dostępne odnawialne plany tygodniowe i roczne. Cena, okres, ewentualny okres próbny i korzyści są widoczne przed zakupem. Opłatę pobiera Apple lub Google. Anuluj co najmniej 24 godziny przed końcem okresu; usunięcie Aplikacji nie anuluje. Zwroty podlegają zasadom sklepu i prawu konsumenckiemu. Uprawnione zakupy przywrócisz w Aplikacji.</p><h2>4. Treści i korzystanie</h2><p>NV Softlab lub licencjodawcy są właścicielami Aplikacji i treści wbudowanych; otrzymujesz osobistą, odwołalną licencję do prywatnej rozrywki. Twoje legalne oryginalne treści należą do Ciebie i pozostają lokalne. Zakazane jest nękanie, przymus, naruszanie praw, obchodzenie zabezpieczeń/płatności, inżynieria wsteczna poza prawem, odsprzedaż i dystrybucja treści wbudowanych.</p><h2>5. Dostępność i odpowiedzialność</h2><p>Możemy zmieniać funkcje z powodów produktowych, bezpieczeństwa, usług lub prawa, z zachowaniem bezwzględnych praw konsumenta. Aplikacja jest dostarczana „tak jak jest”. W granicach prawa wyłączamy domniemane gwarancje i szkody pośrednie, ale nie praw ani odpowiedzialności, których wyłączyć nie wolno.</p><h2>6. Zakończenie, prawo i prywatność</h2><p>Możemy ograniczyć dostęp z powodu oszustwa, nadużycia, ryzyka lub naruszenia. Obowiązuje prawo polskie i sądy we Wrocławiu, chyba że bezwzględne prawo konsumenckie stanowi inaczej. Zmiany pojawią się tutaj. Zobacz <a href="../privacy-policy/">Politykę Prywatności</a>. Kontakt: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
uk:{title:'Умови використання',label:'Мова',date:'Дата набрання чинності:',privacy:'Політика конфіденційності',support:'Підтримка',html:`<p>Ці Умови регулюють використання <strong>Truth or Dare</strong> від JDG Nazar Dzys під назвою NV Softlab. Використовуючи Застосунок, ви їх приймаєте.</p><h2>1. Лише для дорослих</h2><p>Вам має бути щонайменше 18 років. Застосунок містить дорослі теми й призначений для розваги повнолітніх за взаємною згодою.</p><h2>2. Згода та безпека</h2><p>Кожне питання чи завдання добровільне. Поважайте межі; кожен може пропустити або зупинитися. Не робіть нічого незаконного, небезпечного, шкідливого, принизливого, примусового чи небажаного й не користуйтеся Застосунком за кермом. Ви відповідаєте за вибір і оточення.</p><h2>3. Підписки</h2><p>Можуть пропонуватися автоматично поновлювані тижневі та річні плани. Ціна, строк, пробний період і переваги показані до покупки. Оплату стягує Apple або Google. Скасуйте не пізніше ніж за 24 години до завершення; видалення Застосунку не скасовує. Повернення визначають правила магазину й закон. Доступні покупки можна відновити в Застосунку.</p><h2>4. Вміст і використання</h2><p>NV Softlab або ліцензіари володіють Застосунком і вбудованим вмістом; ви отримуєте особисту відкличну ліцензію для приватної розваги. Ваш законний оригінальний вміст належить вам і лишається локальним. Заборонені переслідування, примус, порушення прав, обхід захисту/оплат, зворотна розробка поза законом, перепродаж і поширення вбудованого вмісту.</p><h2>5. Доступність і відповідальність</h2><p>Ми можемо змінювати функції з продуктових, безпекових, сервісних чи правових причин із дотриманням обов’язкових прав споживача. Застосунок надається «як є». У межах закону виключаються неявні гарантії й непрямі збитки, але не права чи відповідальність, які виключити не можна.</p><h2>6. Припинення, право та приватність</h2><p>Ми можемо обмежити доступ через шахрайство, зловживання, ризик або порушення. Застосовується право Польщі та суди Вроцлава, крім обов’язкового захисту споживача. Зміни з’являться тут. Див. <a href="../privacy-policy/">Політику конфіденційності</a>. Контакт: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},

pt_BR:{title:'Termos de Uso',label:'Idioma',date:'Data de vigência:',privacy:'Política de Privacidade',support:'Suporte',html:`<p>Estes Termos regem o uso de <strong>Truth or Dare</strong>, fornecido por JDG Nazar Dzys sob NV Softlab. Ao usar, você os aceita.</p><h2>1. Somente adultos</h2><p>Você deve ter pelo menos 18 anos. O Aplicativo contém temas adultos e é entretenimento para adultos que consentem.</p><h2>2. Consentimento e segurança</h2><p>Toda pergunta e desafio é opcional. Respeite limites; qualquer pessoa pode pular ou parar. Não faça nada ilegal, inseguro, nocivo, humilhante, forçado ou indesejado, nem use ao dirigir. Você responde por escolhas e ambiente.</p><h2>3. Assinaturas</h2><p>Podem existir planos semanais e anuais autorrenováveis. Preço, período, teste e benefícios aparecem antes da compra. Apple ou Google cobra. Cancele 24 horas antes do fim; excluir o Aplicativo não cancela. Reembolsos seguem a loja e a lei. Restaure compras válidas no Aplicativo.</p><h2>4. Conteúdo e uso</h2><p>NV Softlab ou licenciantes detêm o Aplicativo e conteúdo integrado; você recebe licença pessoal e revogável para entretenimento privado. Seu conteúdo original lícito é seu e fica local. Não assedie, coaja, viole direitos, contorne segurança/pagamento, faça engenharia reversa salvo lei, revenda ou distribua conteúdo integrado.</p><h2>5. Disponibilidade e responsabilidade</h2><p>Podemos alterar recursos por produto, segurança, serviço ou lei, respeitando direitos obrigatórios. O Aplicativo é fornecido “como está”. Dentro da lei excluímos garantias implícitas e perdas indiretas, nunca direitos ou responsabilidade irrenunciáveis.</p><h2>6. Fim, lei e privacidade</h2><p>Podemos limitar acesso por fraude, abuso, risco ou violação. Aplicam-se a lei polonesa e os tribunais de Wrocław salvo proteção obrigatória do consumidor. Mudanças aparecerão aqui. Veja a <a href="../privacy-policy/">Política de Privacidade</a>. Contato: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
hu:{title:'Felhasználási feltételek',label:'Nyelv',date:'Hatálybalépés:',privacy:'Adatvédelmi szabályzat',support:'Támogatás',html:`<p>E Feltételek szabályozzák a JDG Nazar Dzys által NV Softlab néven kínált <strong>Truth or Dare</strong> használatát. Használatával elfogadod őket.</p><h2>1. Csak felnőttek</h2><p>Legalább 18 évesnek kell lenned. Az Alkalmazás felnőtt témákat tartalmaz, és beleegyező felnőttek szórakoztatására szolgál.</p><h2>2. Beleegyezés és biztonság</h2><p>Minden kérdés és feladat választható. Tartsd tiszteletben a határokat; bárki kihagyhat vagy leállhat. Ne tegyél jogellenes, veszélyes, káros, megalázó, kényszerített vagy nem kívánt dolgot, és ne használd vezetés közben. Te felelsz a döntésekért és környezetért.</p><h2>3. Előfizetések</h2><p>Heti és éves automatikusan megújuló csomagok lehetnek. Ár, időszak, próba és előnyök vásárlás előtt látszanak. Az Apple vagy Google terhel. Legalább 24 órával a vége előtt mondd le; a törlés nem mondja le. Visszatérítésre az áruház és a jog szabályai vonatkoznak. Jogos vásárlás az Alkalmazásban visszaállítható.</p><h2>4. Tartalom és használat</h2><p>Az Alkalmazás és beépített tartalom az NV Softlabé vagy licencadóké; személyes, visszavonható magánlicencet kapsz. Jogszerű saját tartalmad a tied és helyben marad. Tilos zaklatás, kényszer, jogsértés, biztonság/fizetés megkerülése, jogellenes visszafejtés, viszonteladás vagy beépített tartalom terjesztése.</p><h2>5. Elérhetőség és felelősség</h2><p>Termék-, biztonsági, szolgáltatási vagy jogi okból módosíthatunk, a kötelező fogyasztói jogok mellett. Az Alkalmazás „adott állapotban” érhető el. A jog keretein belül kizárjuk a hallgatólagos garanciát és közvetett kárt, de a ki nem zárható jogokat nem.</p><h2>6. Megszűnés, jog és adatvédelem</h2><p>Csalás, visszaélés, kockázat vagy szerződésszegés esetén korlátozhatunk. A lengyel jog és wrocławi bíróságok irányadók, kivéve kötelező fogyasztóvédelmet. Lásd az <a href="../privacy-policy/">Adatvédelmi szabályzatot</a>. Kapcsolat: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
id:{title:'Ketentuan Penggunaan',label:'Bahasa',date:'Tanggal berlaku:',privacy:'Kebijakan Privasi',support:'Dukungan',html:`<p>Ketentuan ini mengatur penggunaan <strong>Truth or Dare</strong> dari JDG Nazar Dzys dengan nama NV Softlab. Dengan menggunakannya, Anda setuju.</p><h2>1. Khusus dewasa</h2><p>Anda harus berusia minimal 18 tahun. Aplikasi memuat tema dewasa dan merupakan hiburan bagi orang dewasa yang saling setuju.</p><h2>2. Persetujuan dan keselamatan</h2><p>Setiap pertanyaan atau tantangan bersifat opsional. Hormati batasan; siapa pun dapat melewati atau berhenti. Jangan lakukan hal ilegal, tidak aman, berbahaya, memalukan, dipaksakan, atau tidak diinginkan, dan jangan gunakan saat mengemudi. Anda bertanggung jawab atas pilihan dan lingkungan.</p><h2>3. Langganan</h2><p>Paket mingguan dan tahunan yang diperpanjang otomatis dapat tersedia. Harga, periode, uji coba, dan manfaat tampil sebelum membeli. Apple atau Google menagih. Batalkan 24 jam sebelum akhir; menghapus Aplikasi tidak membatalkan. Pengembalian dana mengikuti toko dan hukum. Pulihkan pembelian yang memenuhi syarat di Aplikasi.</p><h2>4. Konten dan penggunaan</h2><p>NV Softlab atau pemberi lisensi memiliki Aplikasi dan konten bawaan; Anda mendapat lisensi pribadi yang dapat dicabut untuk hiburan privat. Konten asli yang sah tetap milik Anda dan lokal. Dilarang melecehkan, memaksa, melanggar hak, melewati keamanan/pembayaran, merekayasa balik kecuali hukum, menjual kembali, atau menyebarkan konten bawaan.</p><h2>5. Ketersediaan dan tanggung jawab</h2><p>Kami dapat mengubah fitur karena produk, keamanan, layanan, atau hukum dengan tetap menghormati hak wajib. Aplikasi diberikan “apa adanya”. Sejauh hukum mengizinkan, jaminan tersirat dan kerugian tidak langsung dikecualikan, bukan hak atau tanggung jawab yang tak dapat dikecualikan.</p><h2>6. Pengakhiran, hukum, dan privasi</h2><p>Kami dapat membatasi akses karena penipuan, penyalahgunaan, risiko, atau pelanggaran. Hukum Polandia dan pengadilan Wrocław berlaku kecuali perlindungan konsumen wajib. Lihat <a href="../privacy-policy/">Kebijakan Privasi</a>. Kontak: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
it:{title:'Termini di Utilizzo',label:'Lingua',date:'Data di efficacia:',privacy:'Informativa sulla Privacy',support:'Assistenza',html:`<p>Questi Termini regolano l’uso di <strong>Truth or Dare</strong>, fornita da JDG Nazar Dzys come NV Softlab. Usandola, li accetti.</p><h2>1. Solo adulti</h2><p>Devi avere almeno 18 anni. L’App contiene temi maturi ed è intrattenimento per adulti consenzienti.</p><h2>2. Consenso e sicurezza</h2><p>Ogni domanda o sfida è facoltativa. Rispetta i limiti; chiunque può saltare o fermarsi. Non fare nulla di illegale, pericoloso, dannoso, umiliante, forzato o indesiderato e non usare l’App alla guida. Sei responsabile di scelte e ambiente.</p><h2>3. Abbonamenti</h2><p>Possono esserci piani settimanali e annuali con rinnovo automatico. Prezzo, periodo, prova e vantaggi appaiono prima dell’acquisto. Apple o Google addebita. Annulla almeno 24 ore prima della fine; eliminare l’App non annulla. I rimborsi seguono negozio e legge. Ripristina gli acquisti idonei nell’App.</p><h2>4. Contenuti e uso</h2><p>NV Softlab o i licenzianti possiedono App e contenuti inclusi; ricevi una licenza personale revocabile per intrattenimento privato. I tuoi contenuti originali leciti restano tuoi e locali. Vietati molestie, coercizione, violazione di diritti, aggiramento di sicurezza/pagamenti, reverse engineering salvo legge, rivendita o distribuzione dei contenuti inclusi.</p><h2>5. Disponibilità e responsabilità</h2><p>Possiamo cambiare funzioni per prodotto, sicurezza, servizio o legge, rispettando i diritti obbligatori. L’App è fornita “così com’è”. Nei limiti di legge escludiamo garanzie implicite e danni indiretti, non diritti o responsabilità non escludibili.</p><h2>6. Fine, legge e privacy</h2><p>Possiamo limitare l’accesso per frode, abuso, rischio o violazione. Si applicano legge polacca e tribunali di Wrocław salvo tutela obbligatoria. Vedi <a href="../privacy-policy/">Informativa sulla Privacy</a>. Contatto: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
ro:{title:'Termeni de Utilizare',label:'Limbă',date:'Data intrării în vigoare:',privacy:'Politica de Confidențialitate',support:'Asistență',html:`<p>Acești Termeni reglementează utilizarea <strong>Truth or Dare</strong>, oferită de JDG Nazar Dzys ca NV Softlab. Prin utilizare îi acceptați.</p><h2>1. Doar adulți</h2><p>Trebuie să aveți cel puțin 18 ani. Aplicația conține teme mature și este divertisment pentru adulți care consimt.</p><h2>2. Consimțământ și siguranță</h2><p>Fiecare întrebare sau provocare este opțională. Respectați limitele; oricine poate sări sau opri. Nu faceți nimic ilegal, nesigur, dăunător, umilitor, forțat ori nedorit și nu folosiți la volan. Răspundeți de alegeri și mediu.</p><h2>3. Abonamente</h2><p>Pot exista planuri săptămânale și anuale cu reînnoire. Prețul, perioada, proba și beneficiile apar înainte de cumpărare. Apple sau Google taxează. Anulați cu 24 de ore înainte; ștergerea Aplicației nu anulează. Rambursările urmează magazinul și legea. Restabiliți achizițiile eligibile în Aplicație.</p><h2>4. Conținut și utilizare</h2><p>NV Softlab sau licențiatorii dețin Aplicația și conținutul inclus; primiți licență personală revocabilă pentru divertisment privat. Conținutul original legal rămâne al dvs. și local. Sunt interzise hărțuirea, constrângerea, încălcarea drepturilor, ocolirea securității/plății, ingineria inversă în afara legii, revânzarea sau distribuirea conținutului inclus.</p><h2>5. Disponibilitate și răspundere</h2><p>Putem schimba funcții din motive de produs, securitate, serviciu sau lege, cu respectarea drepturilor obligatorii. Aplicația este oferită „ca atare”. În limita legii excludem garanții implicite și pierderi indirecte, nu drepturi sau răspunderi ce nu pot fi excluse.</p><h2>6. Încetare, lege și confidențialitate</h2><p>Putem limita accesul pentru fraudă, abuz, risc sau încălcare. Se aplică legea poloneză și instanțele din Wrocław, exceptând protecția obligatorie. Consultați <a href="../privacy-policy/">Politica de Confidențialitate</a>. Contact: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
nl:{title:'Gebruiksvoorwaarden',label:'Taal',date:'Ingangsdatum:',privacy:'Privacybeleid',support:'Ondersteuning',html:`<p>Deze Voorwaarden regelen het gebruik van <strong>Truth or Dare</strong>, aangeboden door JDG Nazar Dzys als NV Softlab. Door gebruik ga je akkoord.</p><h2>1. Alleen volwassenen</h2><p>Je moet minstens 18 zijn. De App bevat volwassen thema’s en is entertainment voor instemmende volwassenen.</p><h2>2. Toestemming en veiligheid</h2><p>Elke vraag of opdracht is optioneel. Respecteer grenzen; iedereen mag overslaan of stoppen. Doe niets illegaals, onveiligs, schadelijks, vernederends, gedwongens of ongewensts en gebruik de App niet tijdens rijden. Je bent verantwoordelijk voor keuzes en omgeving.</p><h2>3. Abonnementen</h2><p>Er kunnen automatisch verlengende week- en jaarplannen zijn. Prijs, periode, proef en voordelen staan vóór aankoop. Apple of Google brengt in rekening. Annuleer 24 uur voor afloop; verwijderen van de App annuleert niet. Terugbetalingen volgen winkel en wet. Herstel geldige aankopen in de App.</p><h2>4. Inhoud en gebruik</h2><p>NV Softlab of licentiegevers bezitten App en ingebouwde inhoud; je krijgt een persoonlijke herroepbare licentie voor privévermaak. Je rechtmatige originele inhoud blijft van jou en lokaal. Geen intimidatie, dwang, inbreuk, omzeilen van beveiliging/betaling, reverse engineering buiten wet, doorverkoop of verspreiding van ingebouwde inhoud.</p><h2>5. Beschikbaarheid en aansprakelijkheid</h2><p>Wij mogen functies wijzigen voor product, beveiliging, dienst of wet met behoud van verplichte rechten. De App wordt “zoals hij is” geleverd. Voor zover wettelijk sluiten wij impliciete garanties en indirecte schade uit, nooit niet-uitsluitbare rechten of aansprakelijkheid.</p><h2>6. Einde, recht en privacy</h2><p>Wij mogen toegang beperken bij fraude, misbruik, risico of schending. Pools recht en rechtbanken in Wrocław gelden behalve verplichte consumentenbescherming. Zie <a href="../privacy-policy/">Privacybeleid</a>. Contact: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
tr:{title:'Kullanım Koşulları',label:'Dil',date:'Yürürlük tarihi:',privacy:'Gizlilik Politikası',support:'Destek',html:`<p>Bu Koşullar, JDG Nazar Dzys’in NV Softlab adıyla sunduğu <strong>Truth or Dare</strong> kullanımını düzenler. Kullanarak kabul edersiniz.</p><h2>1. Yalnızca yetişkinler</h2><p>En az 18 yaşında olmalısınız. Uygulama yetişkin temaları içerir ve karşılıklı onay veren yetişkinler için eğlencedir.</p><h2>2. Onay ve güvenlik</h2><p>Her soru veya görev isteğe bağlıdır. Sınırlara saygı gösterin; herkes geçebilir veya durabilir. Yasa dışı, güvensiz, zararlı, aşağılayıcı, zorlanmış veya istenmeyen bir şey yapmayın ve sürüşte kullanmayın. Seçim ve çevreden siz sorumlusunuz.</p><h2>3. Abonelikler</h2><p>Otomatik yenilenen haftalık ve yıllık planlar olabilir. Fiyat, süre, deneme ve avantajlar satın almadan önce gösterilir. Apple veya Google ücretlendirir. Bitişten 24 saat önce iptal edin; Uygulamayı silmek iptal etmez. İadeler mağaza ve yasaya tabidir. Uygun satın alımları Uygulamada geri yükleyin.</p><h2>4. İçerik ve kullanım</h2><p>Uygulama ve yerleşik içerik NV Softlab veya lisans verenlere aittir; özel eğlence için kişisel, geri alınabilir lisans alırsınız. Yasal özgün içeriğiniz size aittir ve yerel kalır. Taciz, zorlama, hak ihlali, güvenlik/ödeme aşma, yasa dışı tersine mühendislik, yeniden satış veya yerleşik içerik dağıtımı yasaktır.</p><h2>5. Kullanılabilirlik ve sorumluluk</h2><p>Ürün, güvenlik, hizmet veya hukuk nedeniyle, zorunlu haklara uyarak özellikleri değiştirebiliriz. Uygulama “olduğu gibi” sunulur. Yasanın izin verdiği ölçüde zımni garantiler ve dolaylı kayıplar hariçtir; vazgeçilemeyen haklar hariç değildir.</p><h2>6. Sona erme, hukuk ve gizlilik</h2><p>Dolandırıcılık, kötüye kullanım, risk veya ihlalde erişimi kısıtlayabiliriz. Zorunlu tüketici koruması dışında Polonya hukuku ve Wrocław mahkemeleri geçerlidir. <a href="../privacy-policy/">Gizlilik Politikası</a>na bakın. İletişim: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
cs:{title:'Podmínky používání',label:'Jazyk',date:'Datum účinnosti:',privacy:'Zásady ochrany osobních údajů',support:'Podpora',html:`<p>Tyto Podmínky upravují používání <strong>Truth or Dare</strong> od JDG Nazar Dzys pod značkou NV Softlab. Použitím je přijímáte.</p><h2>1. Jen dospělí</h2><p>Musí vám být nejméně 18 let. Aplikace obsahuje dospělá témata a je zábavou pro souhlasící dospělé.</p><h2>2. Souhlas a bezpečnost</h2><p>Každá otázka nebo úkol jsou volitelné. Respektujte hranice; každý může přeskočit či skončit. Nedělejte nic nezákonného, nebezpečného, škodlivého, ponižujícího, vynuceného či nechtěného a nepoužívejte při řízení. Za volby a okolí odpovídáte vy.</p><h2>3. Předplatné</h2><p>Mohou být týdenní a roční automaticky obnovované plány. Cena, období, zkouška a výhody se zobrazí před nákupem. Účtuje Apple či Google. Zrušte 24 hodin před koncem; smazání Aplikace nezruší. Vrácení se řídí obchodem a zákonem. Oprávněné nákupy obnovte v Aplikaci.</p><h2>4. Obsah a použití</h2><p>NV Softlab či poskytovatelé vlastní Aplikaci a vestavěný obsah; dostáváte osobní odvolatelnou licenci pro soukromou zábavu. Váš zákonný originální obsah zůstává váš a lokální. Zákaz obtěžování, nátlaku, porušení práv, obcházení bezpečnosti/plateb, nezákonného zpětného inženýrství, přeprodeje a šíření vestavěného obsahu.</p><h2>5. Dostupnost a odpovědnost</h2><p>Funkce můžeme měnit z produktových, bezpečnostních, servisních či právních důvodů při zachování povinných práv. Aplikace je „tak jak je“. V rozsahu zákona vylučujeme implicitní záruky a nepřímé škody, nikoli nevyloučitelná práva či odpovědnost.</p><h2>6. Ukončení, právo a soukromí</h2><p>Přístup lze omezit při podvodu, zneužití, riziku či porušení. Platí polské právo a soudy ve Wrocławi kromě povinné ochrany spotřebitele. Viz <a href="../privacy-policy/">Zásady ochrany osobních údajů</a>. Kontakt: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
sv:{title:'Användarvillkor',label:'Språk',date:'Gäller från:',privacy:'Integritetspolicy',support:'Support',html:`<p>Dessa Villkor styr användningen av <strong>Truth or Dare</strong> från JDG Nazar Dzys under NV Softlab. Genom användning godkänner du dem.</p><h2>1. Endast vuxna</h2><p>Du måste vara minst 18 år. Appen innehåller vuxna teman och är underhållning för samtyckande vuxna.</p><h2>2. Samtycke och säkerhet</h2><p>Varje fråga eller utmaning är valfri. Respektera gränser; alla kan hoppa över eller sluta. Gör inget olagligt, osäkert, skadligt, förnedrande, framtvingat eller oönskat och använd inte vid körning. Du ansvarar för val och omgivning.</p><h2>3. Prenumerationer</h2><p>Vecko- och årsplaner med automatisk förnyelse kan finnas. Pris, period, prov och förmåner visas före köp. Apple eller Google debiterar. Avbryt 24 timmar före slut; radering av Appen avbryter inte. Återbetalning följer butik och lag. Återställ berättigade köp i Appen.</p><h2>4. Innehåll och användning</h2><p>NV Softlab eller licensgivare äger Appen och inbyggt innehåll; du får en personlig återkallelig licens för privat underhållning. Lagligt eget innehåll är ditt och stannar lokalt. Förbud mot trakasserier, tvång, rättighetsintrång, kringgående av säkerhet/betalning, olaglig reverse engineering, återförsäljning eller spridning av inbyggt innehåll.</p><h2>5. Tillgänglighet och ansvar</h2><p>Vi får ändra funktioner av produkt-, säkerhets-, tjänste- eller rättsskäl med respekt för tvingande rättigheter. Appen tillhandahålls ”i befintligt skick”. Inom lagen utesluter vi underförstådda garantier och indirekta skador, inte rättigheter eller ansvar som inte kan uteslutas.</p><h2>6. Slut, lag och integritet</h2><p>Vi får begränsa åtkomst vid bedrägeri, missbruk, risk eller brott. Polsk lag och domstolar i Wrocław gäller utom tvingande konsumentskydd. Se <a href="../privacy-policy/">Integritetspolicy</a>. Kontakt: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
ru:{title:'Условия использования',label:'Язык',date:'Дата вступления в силу:',privacy:'Политика конфиденциальности',support:'Поддержка',html:`<p>Эти Условия регулируют использование <strong>Truth or Dare</strong> от JDG Nazar Dzys под именем NV Softlab. Используя Приложение, вы соглашаетесь.</p><h2>1. Только для взрослых</h2><p>Вам должно быть не менее 18 лет. Приложение содержит взрослые темы и предназначено для развлечения согласных взрослых.</p><h2>2. Согласие и безопасность</h2><p>Любой вопрос или задание добровольны. Уважайте границы; любой может пропустить или остановиться. Не делайте ничего незаконного, опасного, вредного, унизительного, принудительного или нежелательного и не используйте за рулём. Вы отвечаете за выбор и окружение.</p><h2>3. Подписки</h2><p>Могут предлагаться автоматически продлеваемые недельные и годовые планы. Цена, срок, проба и преимущества показаны до покупки. Оплату списывает Apple или Google. Отмените за 24 часа до конца; удаление Приложения не отменяет. Возвраты регулируются магазином и законом. Доступные покупки восстанавливаются в Приложении.</p><h2>4. Контент и использование</h2><p>NV Softlab или лицензиары владеют Приложением и встроенным контентом; вы получаете личную отзывную лицензию для частного развлечения. Ваш законный оригинальный контент принадлежит вам и остаётся локальным. Запрещены преследование, принуждение, нарушение прав, обход защиты/оплаты, незаконная обратная разработка, перепродажа и распространение встроенного контента.</p><h2>5. Доступность и ответственность</h2><p>Мы можем менять функции по продуктовым, безопасностным, сервисным или правовым причинам с соблюдением обязательных прав. Приложение предоставляется «как есть». В пределах закона исключены подразумеваемые гарантии и косвенные убытки, но не права и ответственность, которые исключить нельзя.</p><h2>6. Прекращение, право и приватность</h2><p>Мы можем ограничить доступ из-за мошенничества, злоупотребления, риска или нарушения. Действуют право Польши и суды Вроцлава, кроме обязательной защиты потребителя. См. <a href="../privacy-policy/">Политику конфиденциальности</a>. Контакт: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`},
da:{title:'Brugsvilkår',label:'Sprog',date:'Ikrafttrædelsesdato:',privacy:'Privatlivspolitik',support:'Support',html:`<p>Disse Vilkår regulerer brugen af <strong>Truth or Dare</strong> fra JDG Nazar Dzys under NV Softlab. Ved brug accepterer du dem.</p><h2>1. Kun voksne</h2><p>Du skal være mindst 18 år. Appen indeholder voksne temaer og er underholdning for samtykkende voksne.</p><h2>2. Samtykke og sikkerhed</h2><p>Alle spørgsmål og udfordringer er valgfrie. Respekter grænser; alle kan springe over eller stoppe. Gør intet ulovligt, usikkert, skadeligt, ydmygende, tvunget eller uønsket, og brug ikke under kørsel. Du er ansvarlig for valg og omgivelser.</p><h2>3. Abonnementer</h2><p>Der kan være ugentlige og årlige planer med automatisk fornyelse. Pris, periode, prøve og fordele vises før køb. Apple eller Google opkræver. Annuller 24 timer før udløb; sletning af Appen annullerer ikke. Refusion følger butik og lov. Gendan berettigede køb i Appen.</p><h2>4. Indhold og brug</h2><p>NV Softlab eller licensgivere ejer Appen og indbygget indhold; du får en personlig, tilbagekaldelig licens til privat underholdning. Lovligt originalt indhold er dit og forbliver lokalt. Ingen chikane, tvang, rettighedsbrud, omgåelse af sikkerhed/betaling, ulovlig reverse engineering, videresalg eller distribution af indbygget indhold.</p><h2>5. Tilgængelighed og ansvar</h2><p>Vi kan ændre funktioner af produkt-, sikkerheds-, service- eller lovgrunde med respekt for ufravigelige rettigheder. Appen leveres “som den er”. Inden for loven udelukker vi stiltiende garantier og indirekte tab, ikke rettigheder eller ansvar der ikke kan udelukkes.</p><h2>6. Ophør, lov og privatliv</h2><p>Vi kan begrænse adgang ved svig, misbrug, risiko eller brud. Polsk lov og domstole i Wrocław gælder bortset fra ufravigelig forbrugerbeskyttelse. Se <a href="../privacy-policy/">Privatlivspolitik</a>. Kontakt: <a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a>.</p>`}

const select=document.getElementById('language');Object.entries(languages).forEach(([k,v])=>select.add(new Option(v,k)));function locale(){const q=new URLSearchParams(location.search).get('lang');if(copy[q])return q;const raw=(navigator.language||'en').replace('-','_');return copy[raw]?raw:(copy[raw.split('_')[0]]?raw.split('_')[0]:'en')}function show(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang.replace('_','-');document.title=`${c.title} — Truth or Dare`;document.getElementById('title').textContent=c.title;document.getElementById('language-label').textContent=c.label;document.getElementById('date-label').textContent=c.date;document.getElementById('content').innerHTML=c.html;const privacy=document.getElementById('privacy');const support=document.getElementById('support');privacy.textContent=c.privacy;support.textContent=c.support;privacy.href=`../privacy-policy/?lang=${encodeURIComponent(lang)}`;support.href=`../support/?lang=${encodeURIComponent(lang)}`;select.value=lang;const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState({},'',u)}select.addEventListener('change',()=>show(select.value));show(locale());
