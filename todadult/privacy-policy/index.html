en:{title:'Privacy Policy',label:'Language',updated:'Last updated:',terms:'Terms of Use',support:'Support',html:`<p>This Policy explains how JDG Nazar Dzys, trading as NV Softlab (“we”), handles information in the <strong>Truth or Dare</strong> mobile app (“App”).</p><h2>1. Controller and contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Poland<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data kept on your device</h2><p>Player names, preferences, language, progress, notification settings, and the text and names of custom decks and cards are stored locally. The App does not upload that custom content to us. It is removed when you delete it individually or uninstall/clear the App’s data.</p><h2>3. Services and data they process</h2><p>The App does not include analytics or install-attribution services. We do not receive player names, custom deck names, custom IDs, custom card text, or gameplay events.</p><p>RevenueCat and Apple App Store or Google Play process product IDs, purchase and subscription status, entitlement, transaction, country, and currency information. We never receive full payment-card details. If you email us, we process your address and message to answer you.</p><h2>4. Purposes and legal bases</h2><p>Purchase data is used to provide and restore Pro access, manage subscriptions, prevent fraud, support users, and meet tax and legal obligations. Legal bases are contract, legitimate interests in security, and legal obligations.</p><h2>5. Providers, transfers, and retention</h2><p>Providers are <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple, and Google. They must protect data consistently with this Policy and applicable law. Some processing may occur outside the EEA under adequacy decisions or safeguards such as Standard Contractual Clauses. Purchase, tax, and support records are retained under provider settings and only as long as needed for these purposes or as required by law.</p><h2>6. Your rights</h2><p>Depending on law, you may request access, correction, deletion, restriction, portability, or object; and complain to a supervisory authority. Email us to exercise a right. We may request enough information to verify and fulfil it.</p><h2>7. Adults only and changes</h2><p>The App is for adults aged 18 or older. We do not knowingly offer it to children or knowingly collect their personal data. We may update this Policy when the App, providers, or law changes; the current version and date remain on this page.</p>`},
de:{title:'Datenschutzerklärung',label:'Sprache',updated:'Zuletzt aktualisiert:',terms:'Nutzungsbedingungen',support:'Support',html:`<p>Diese Erklärung beschreibt, wie JDG Nazar Dzys, handelnd als NV Softlab („wir“), Informationen in der mobilen App <strong>Truth or Dare</strong> („App“) verarbeitet.</p><h2>1. Verantwortlicher und Kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Daten auf deinem Gerät</h2><p>Spielernamen, Einstellungen, Sprache, Fortschritt, Benachrichtigungseinstellungen sowie Texte und Namen eigener Decks und Karten bleiben lokal. Die App lädt diese eigenen Inhalte nicht zu uns hoch. Sie werden gelöscht, wenn du sie einzeln löschst oder die App deinstallierst bzw. ihre Daten löschst.</p><h2>3. Dienste und verarbeitete Daten</h2><p>Die App enthält keine Analyse- oder Installationszuordnungsdienste. Wir erhalten keine Spielernamen, Namen oder IDs eigener Decks, Texte eigener Karten oder Spielereignisse.</p><p>RevenueCat sowie Apple App Store oder Google Play verarbeiten Produkt-IDs, Kauf-, Abo- und Berechtigungsstatus, Transaktion, Land und Währung. Vollständige Kartendaten erhalten wir nie. Bei E-Mail-Support verarbeiten wir Adresse und Nachricht zur Antwort.</p><h2>4. Zwecke und Rechtsgrundlagen</h2><p>Kaufdaten werden verwendet, um Pro-Zugriff bereitzustellen und wiederherzustellen, Abonnements zu verwalten, Betrug zu verhindern, Support zu leisten und steuerliche sowie rechtliche Pflichten zu erfüllen. Rechtsgrundlagen sind Vertrag, berechtigte Sicherheitsinteressen und gesetzliche Pflichten.</p><h2>5. Anbieter, Übermittlung und Speicherung</h2><p>Anbieter sind <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple und Google. Sie müssen Daten nach dieser Erklärung und geltendem Recht schützen. Übermittlungen außerhalb des EWR erfolgen auf Grundlage geeigneter Garantien. Daten bleiben nur so lange gespeichert, wie es für Käufe, Steuern, Support oder gesetzliche Pflichten nötig ist.</p><h2>6. Deine Rechte</h2><p>Du kannst je nach Recht Auskunft, Berichtigung, Löschung, Einschränkung, Übertragbarkeit oder Widerspruch verlangen und dich bei einer Aufsichtsbehörde beschweren. Kontaktiere uns per E-Mail.</p><h2>7. Nur Erwachsene und Änderungen</h2><p>Die App ist nur für Personen ab 18 Jahren. Wir richten sie nicht wissentlich an Kinder und erfassen nicht wissentlich deren personenbezogene Daten. Änderungen erscheinen mit aktuellem Datum auf dieser Seite.</p>`},
es:{title:'Política de Privacidad',label:'Idioma',updated:'Última actualización:',terms:'Términos de Uso',support:'Soporte',html:`<p>Esta Política explica cómo JDG Nazar Dzys, que opera como NV Softlab («nosotros»), trata la información en la aplicación móvil <strong>Truth or Dare</strong> («App»).</p><h2>1. Responsable y contacto</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Datos guardados en tu dispositivo</h2><p>Los nombres de jugadores, preferencias, idioma, progreso, ajustes de notificaciones y los textos y nombres de barajas y cartas personalizadas se guardan localmente. La App no nos los sube. Se eliminan al borrarlos individualmente o al desinstalar/borrar los datos de la App.</p><h2>3. Servicios y datos tratados</h2><p>La App no incluye servicios de analítica ni de atribución de instalaciones. No recibimos nombres de jugadores, nombres o ID de barajas personalizadas, texto de cartas propias ni eventos de juego.</p><p>RevenueCat y Apple App Store o Google Play tratan ID de producto, estado de compra, suscripción y acceso, transacción, país y moneda. Nunca recibimos datos completos de tarjeta. Para soporte tratamos tu correo y mensaje.</p><h2>4. Fines y bases jurídicas</h2><p>Los datos de compra se usan para ofrecer y restaurar el acceso Pro, gestionar suscripciones, prevenir el fraude, prestar soporte y cumplir obligaciones fiscales y legales. Las bases son el contrato, el interés legítimo en la seguridad y las obligaciones legales.</p><h2>5. Proveedores, transferencias y conservación</h2><p>Usamos <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple y Google. Deben proteger los datos conforme a esta Política y la ley. Las transferencias fuera del EEE se realizan con garantías adecuadas. Los registros se conservan solo durante el tiempo necesario para las compras, los impuestos y el soporte, o durante el plazo que exija la ley.</p><h2>6. Tus derechos</h2><p>Según la ley, puedes pedir acceso, rectificación, supresión, limitación, portabilidad u oposición; y reclamar ante una autoridad. Escríbenos para ejercerlos.</p><h2>7. Solo adultos y cambios</h2><p>La App es solo para mayores de 18 años. No la ofrecemos ni recopilamos conscientemente datos de menores. Las actualizaciones se publicarán aquí con la fecha vigente.</p>`},
fr:{title:'Politique de Confidentialité',label:'Langue',updated:'Dernière mise à jour :',terms:'Conditions d’Utilisation',support:'Assistance',html:`<p>Cette Politique explique comment JDG Nazar Dzys, exerçant sous le nom NV Softlab (« nous »), traite les informations dans l’application mobile <strong>Truth or Dare</strong> (« App »).</p><h2>1. Responsable et contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Pologne<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Données conservées sur votre appareil</h2><p>Les noms des joueurs, préférences, langue, progression, réglages de notifications ainsi que les textes et noms de paquets et cartes personnalisés restent en local. L’App ne nous transmet pas ces contenus. Ils disparaissent lorsque vous les supprimez ou désinstallez/effacez les données de l’App.</p><h2>3. Services et données traitées</h2><p>L’App n’inclut aucun service d’analyse ou d’attribution des installations. Nous ne recevons ni noms de joueurs, ni noms ou identifiants de paquets personnalisés, ni texte de cartes créées, ni événements de jeu.</p><p>RevenueCat et l’App Store d’Apple ou Google Play traitent les identifiants de produits, achats, abonnements, droits, transactions, pays et devise. Nous ne recevons jamais vos données bancaires complètes. Pour l’assistance, nous traitons votre e-mail et votre message.</p><h2>4. Finalités et bases légales</h2><p>Les données d’achat servent à fournir et restaurer l’accès Pro, gérer les abonnements, prévenir la fraude, assurer l’assistance et respecter les obligations fiscales et légales. Les bases sont le contrat, l’intérêt légitime de sécurité et les obligations légales.</p><h2>5. Prestataires, transferts et conservation</h2><p>Nous utilisons <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple et Google. Ils doivent protéger les données conformément à cette Politique et au droit applicable. Les transferts hors EEE reposent sur des garanties appropriées. Les données ne sont gardées que le temps requis pour les achats, la fiscalité et l’assistance, ou pendant la durée exigée par la loi.</p><h2>6. Vos droits</h2><p>Selon la loi, vous pouvez demander accès, rectification, effacement, limitation, portabilité ou opposition et saisir une autorité. Écrivez-nous pour les exercer.</p><h2>7. Adultes uniquement et modifications</h2><p>L’App est réservée aux personnes de 18 ans ou plus. Nous ne la proposons pas sciemment aux enfants et ne collectons pas sciemment leurs données. Toute mise à jour sera publiée ici avec sa date.</p>`},
pl:{title:'Polityka Prywatności',label:'Język',updated:'Ostatnia aktualizacja:',terms:'Warunki Użytkowania',support:'Pomoc',html:`<p>Niniejsza Polityka wyjaśnia, jak JDG Nazar Dzys, działający jako NV Softlab („my”), przetwarza informacje w aplikacji mobilnej <strong>Truth or Dare</strong> („Aplikacja”).</p><h2>1. Administrator i kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polska<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dane na Twoim urządzeniu</h2><p>Imiona graczy, ustawienia, język, postęp, ustawienia powiadomień oraz teksty i nazwy własnych talii i kart są przechowywane lokalnie. Aplikacja nie przesyła nam tych treści. Znikają po ich osobnym usunięciu albo odinstalowaniu/wyczyszczeniu danych Aplikacji.</p><h2>3. Usługi i przetwarzane dane</h2><p>Aplikacja nie zawiera usług analitycznych ani atrybucji instalacji. Nie otrzymujemy imion graczy, nazw ani ID własnych talii, tekstu własnych kart ani zdarzeń z rozgrywki.</p><p>RevenueCat oraz Apple App Store lub Google Play przetwarzają ID produktów, status zakupu, subskrypcji i uprawnień, transakcję, kraj i walutę. Nigdy nie otrzymujemy pełnych danych karty. W sprawach pomocy przetwarzamy Twój e-mail i wiadomość.</p><h2>4. Cele i podstawy prawne</h2><p>Dane zakupowe służą do zapewniania i przywracania dostępu Pro, zarządzania subskrypcjami, zapobiegania oszustwom, obsługi użytkowników oraz realizacji obowiązków podatkowych i prawnych. Podstawami są umowa, uzasadniony interes bezpieczeństwa i obowiązki prawne.</p><h2>5. Dostawcy, transfery i przechowywanie</h2><p>Korzystamy z <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple i Google. Muszą chronić dane zgodnie z tą Polityką i prawem. Przekazywanie danych poza EOG odbywa się w oparciu o odpowiednie zabezpieczenia. Dane przechowuje się tylko tak długo, jak wymagają tego zakupy, podatki, pomoc lub przepisy prawa.</p><h2>6. Twoje prawa</h2><p>Zależnie od prawa możesz żądać dostępu, poprawienia, usunięcia, ograniczenia, przeniesienia lub sprzeciwu i złożyć skargę do organu nadzorczego. Napisz do nas, by skorzystać z praw.</p><h2>7. Tylko dorośli i zmiany</h2><p>Aplikacja jest tylko dla osób w wieku co najmniej 18 lat. Świadomie nie oferujemy jej dzieciom ani nie zbieramy ich danych. Zmiany opublikujemy tutaj z aktualną datą.</p>`},
uk:{title:'Політика конфіденційності',label:'Мова',updated:'Останнє оновлення:',terms:'Умови використання',support:'Підтримка',html:`<p>Ця Політика пояснює, як JDG Nazar Dzys, яка провадить діяльність під торговою назвою NV Softlab («ми»), обробляє інформацію в мобільному застосунку <strong>Truth or Dare</strong> («Застосунок»).</p><h2>1. Володілець персональних даних і контакти</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Польща<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Дані на вашому пристрої</h2><p>Імена гравців, налаштування, мова, прогрес, параметри сповіщень, а також тексти й назви власних колод і карт зберігаються локально. Застосунок не надсилає нам цей вміст. Він видаляється, коли ви видаляєте його окремо, видаляєте Застосунок або очищаєте його дані.</p><h2>3. Сервіси та дані</h2><p>Застосунок не містить сервісів аналітики чи атрибуції встановлень. Ми не отримуємо імена гравців, назви або ID власних колод, тексти власних карт чи події гри.</p><p>RevenueCat і Apple App Store чи Google Play обробляють ID продукту, статус покупки, підписки й доступу, транзакцію, країну та валюту. Повні дані платіжної картки ми не отримуємо. Якщо ви пишете нам, ми обробляємо вашу електронну адресу й повідомлення, щоб відповісти.</p><h2>4. Цілі та правові підстави</h2><p>Дані про покупки використовуються для надання й відновлення Pro-доступу, керування підписками, запобігання шахрайству, підтримки користувачів і виконання податкових та юридичних обов’язків. Підстави — договір, законний інтерес у безпеці та юридичні обов’язки.</p><h2>5. Постачальники, передавання й зберігання</h2><p>Ми використовуємо <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple і Google. Вони мають захищати дані відповідно до цієї Політики й закону. Передавання за межі ЄЕП здійснюється за наявності належних гарантій. Дані зберігаються лише стільки, скільки потрібно для покупок, податків і підтримки, або скільки цього вимагає закон.</p><h2>6. Ваші права</h2><p>Залежно від закону ви можете вимагати доступу до даних, їх виправлення, видалення, обмеження обробки чи перенесення, а також заперечити проти обробки. Ви також маєте право поскаржитися до наглядового органу. Щоб скористатися своїми правами, напишіть нам.</p><h2>7. Лише для дорослих і зміни</h2><p>Застосунок призначено лише для осіб від 18 років. Ми свідомо не пропонуємо його дітям і не збираємо їхні дані. Оновлення публікуватимуться тут із новою датою.</p>`},
pt:{title:'Política de Privacidade',label:'Idioma',updated:'Última atualização:',terms:'Termos de Utilização',support:'Apoio',html:`<p>Esta Política explica como JDG Nazar Dzys, sob a marca NV Softlab («nós»), trata informações na aplicação móvel <strong>Truth or Dare</strong> («Aplicação»).</p><h2>1. Responsável e contacto</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polónia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dados no dispositivo</h2><p>Nomes de jogadores, preferências, idioma, progresso, notificações e textos e nomes de baralhos e cartas personalizados ficam localmente. A Aplicação não nos envia esse conteúdo. É removido quando o apaga ou desinstala/limpa os dados da Aplicação.</p><h2>3. Serviços e dados tratados</h2><p>A Aplicação não inclui serviços de análise nem de atribuição de instalações. Não recebemos nomes de jogadores, nomes ou ID de baralhos personalizados, texto de cartas próprias nem eventos de jogo.</p><p>RevenueCat e Apple App Store ou Google Play tratam ID do produto, compra, subscrição, direito, transação, país e moeda. Nunca recebemos dados completos do cartão. Para apoio tratamos o seu e-mail e mensagem.</p><h2>4. Finalidades e bases legais</h2><p>Os dados de compra são usados para fornecer e restaurar o acesso Pro, gerir subscrições, prevenir fraude, prestar apoio e cumprir obrigações fiscais e legais. As bases são o contrato, o interesse legítimo de segurança e as obrigações legais.</p><h2>5. Fornecedores, transferências e retenção</h2><p>Usamos <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Devem proteger os dados segundo esta Política e a lei. As transferências fora do EEE são efetuadas com garantias adequadas. Os dados ficam apenas enquanto forem necessários para compras, impostos e apoio, ou pelo prazo exigido por lei.</p><h2>6. Direitos</h2><p>Conforme a lei, pode pedir acesso, correção, eliminação, limitação, portabilidade ou oposição e reclamar a uma autoridade. Contacte-nos por e-mail.</p><h2>7. Só adultos e alterações</h2><p>A Aplicação destina-se apenas a maiores de 18 anos. Não a oferecemos nem recolhemos conscientemente dados de crianças. Alterações serão publicadas aqui com a data atual.</p>`},
pt_BR:{title:'Política de Privacidade',label:'Idioma',updated:'Última atualização:',terms:'Termos de Uso',support:'Suporte',html:`<p>Esta Política explica como JDG Nazar Dzys, sob a marca NV Softlab (“nós”), trata informações no aplicativo móvel <strong>Truth or Dare</strong> (“Aplicativo”).</p><h2>1. Controlador e contato</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polônia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dados no aparelho</h2><p>Nomes de jogadores, preferências, idioma, progresso, notificações e textos e nomes de baralhos e cartas personalizados ficam armazenados localmente. O Aplicativo não nos envia esse conteúdo. Ele é removido quando você o exclui ou desinstala/limpa os dados do Aplicativo.</p><h2>3. Serviços e dados tratados</h2><p>O Aplicativo não inclui serviços de análise nem de atribuição de instalações. Não recebemos nomes de jogadores, nomes ou IDs de baralhos personalizados, texto de cartas próprias nem eventos de jogo.</p><p>RevenueCat e Apple App Store ou Google Play tratam ID do produto, compra, assinatura, direito, transação, país e moeda. Nunca recebemos dados completos do cartão. Para suporte tratamos seu e-mail e mensagem.</p><h2>4. Finalidades e bases legais</h2><p>Os dados de compra são usados para fornecer e restaurar o acesso Pro, gerenciar assinaturas, prevenir fraudes, prestar suporte e cumprir obrigações fiscais e legais. As bases são o contrato, o interesse legítimo em segurança e as obrigações legais.</p><h2>5. Fornecedores, transferências e retenção</h2><p>Usamos <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Eles devem proteger os dados conforme esta Política e a lei. As transferências internacionais são realizadas com garantias adequadas. Dados ficam somente enquanto forem necessários para compras, impostos e suporte, ou pelo prazo exigido por lei.</p><h2>6. Direitos</h2><p>Conforme a lei, você pode pedir acesso, correção, exclusão, limitação, portabilidade ou oposição e reclamar a uma autoridade. Fale conosco por e-mail.</p><h2>7. Somente adultos e alterações</h2><p>O Aplicativo destina-se apenas a maiores de 18 anos. Não o oferecemos nem coletamos conscientemente dados de crianças. Alterações serão publicadas aqui com a data atual.</p>`},
hu:{title:'Adatvédelmi szabályzat',label:'Nyelv',updated:'Utolsó frissítés:',terms:'Felhasználási feltételek',support:'Támogatás',html:`<p>Ez a Szabályzat ismerteti, hogyan kezeli a JDG Nazar Dzys, NV Softlab néven („mi”) az adatokat a <strong>Truth or Dare</strong> mobilalkalmazásban („Alkalmazás”).</p><h2>1. Adatkezelő és kapcsolat</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Lengyelország<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Az eszközön tárolt adatok</h2><p>A játékosnevek, beállítások, nyelv, haladás, értesítések, valamint az egyéni paklik és kártyák neve és szövege helyben marad. Az Alkalmazás ezt nem tölti fel hozzánk. Egyenkénti törléskor vagy az Alkalmazás eltávolításakor/adatainak törlésekor megszűnik.</p><h2>3. Szolgáltatások és adatok</h2><p>Az Alkalmazás nem tartalmaz analitikai vagy telepítés-hozzárendelési szolgáltatásokat. Nem kapunk játékosneveket, egyéni paklineveket vagy azonosítókat, saját kártyaszövegeket vagy játékmeneti eseményeket.</p><p>A RevenueCat és az Apple App Store vagy Google Play termék-, vásárlási, előfizetési, jogosultsági, tranzakciós, ország- és pénznemadatokat kezel. Teljes bankkártyaadatot nem kapunk. Támogatáskor az e-mailt és üzenetet kezeljük.</p><h2>4. Célok és jogalapok</h2><p>A vásárlási adatokat a Pro-hozzáférés biztosítására és visszaállítására, az előfizetések kezelésére, a csalás megelőzésére, támogatásra, valamint adó- és jogi kötelezettségek teljesítésére használjuk. A jogalap a szerződés, a biztonsághoz fűződő jogos érdek és a jogi kötelezettség.</p><h2>5. Szolgáltatók, továbbítás, megőrzés</h2><p>Szolgáltatók: <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple és Google. Az adatokat e Szabályzat és a jog szerint kell védeniük. EGT-n kívüli továbbítás megfelelő garanciákkal történik. Az adatokat csak addig őrzik, ameddig az a vásárlásokhoz, az adózáshoz, a támogatáshoz vagy a jogszabályi kötelezettségek teljesítéséhez szükséges.</p><h2>6. Jogok</h2><p>A jog szerint hozzáférést, helyesbítést, törlést, korlátozást, hordozhatóságot vagy tiltakozást kérhet és hatósághoz fordulhat. Írjon nekünk.</p><h2>7. Csak felnőttek és változások</h2><p>Az Alkalmazás kizárólag 18 éven felülieknek szól. Tudatosan nem kínáljuk gyermekeknek és nem gyűjtjük adataikat. A változásokat új dátummal itt közöljük.</p>`},
id:{title:'Kebijakan Privasi',label:'Bahasa',updated:'Terakhir diperbarui:',terms:'Ketentuan Penggunaan',support:'Dukungan',html:`<p>Kebijakan ini menjelaskan cara JDG Nazar Dzys, dengan nama NV Softlab (“kami”), menangani informasi dalam aplikasi seluler <strong>Truth or Dare</strong> (“Aplikasi”).</p><h2>1. Pengendali dan kontak</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polandia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data di perangkat</h2><p>Nama pemain, preferensi, bahasa, progres, pengaturan notifikasi, serta teks dan nama dek dan kartu buatan disimpan secara lokal. Aplikasi tidak mengunggah konten itu kepada kami. Data hilang saat dihapus satu per satu atau saat Aplikasi dicopot/datanya dibersihkan.</p><h2>3. Layanan dan data</h2><p>Aplikasi tidak menyertakan layanan analitik atau atribusi pemasangan. Kami tidak menerima nama pemain, nama atau ID dek buatan, teks kartu buatan, maupun peristiwa permainan.</p><p>RevenueCat dan Apple App Store atau Google Play memproses ID produk, status pembelian, langganan, hak akses, transaksi, negara, dan mata uang. Kami tidak menerima detail kartu lengkap. Untuk dukungan, kami memproses email dan pesan Anda.</p><h2>4. Tujuan dan dasar hukum</h2><p>Data pembelian digunakan untuk menyediakan dan memulihkan akses Pro, mengelola langganan, mencegah penipuan, memberi dukungan, serta memenuhi kewajiban pajak dan hukum. Dasarnya adalah kontrak, kepentingan keamanan yang sah, dan kewajiban hukum.</p><h2>5. Penyedia, transfer, dan penyimpanan</h2><p>Kami memakai <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple, dan Google. Mereka wajib melindungi data sesuai Kebijakan ini dan hukum. Transfer internasional memakai perlindungan yang sesuai. Data disimpan hanya selama dibutuhkan untuk pembelian, pajak, dan dukungan, atau selama diwajibkan oleh hukum.</p><h2>6. Hak Anda</h2><p>Sesuai hukum, Anda dapat meminta akses, koreksi, penghapusan, pembatasan, portabilitas, atau keberatan, dan mengadu ke otoritas. Hubungi kami lewat email.</p><h2>7. Khusus dewasa dan perubahan</h2><p>Aplikasi hanya untuk usia 18 tahun ke atas. Kami tidak sengaja menawarkannya kepada anak atau mengumpulkan data mereka. Perubahan akan diterbitkan di sini dengan tanggal baru.</p>`},
it:{title:'Informativa sulla Privacy',label:'Lingua',updated:'Ultimo aggiornamento:',terms:'Termini di Utilizzo',support:'Assistenza',html:`<p>Questa Informativa spiega come JDG Nazar Dzys, operante come NV Softlab (“noi”), tratta le informazioni nell’app mobile <strong>Truth or Dare</strong> (“App”).</p><h2>1. Titolare e contatti</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dati sul dispositivo</h2><p>Nomi dei giocatori, preferenze, lingua, progressi, notifiche e testi e nomi di mazzi e carte personalizzati restano in locale. L’App non ci carica tali contenuti. Sono rimossi quando li elimini o disinstalli/cancelli i dati dell’App.</p><h2>3. Servizi e dati trattati</h2><p>L’App non include servizi di analisi o attribuzione delle installazioni. Non riceviamo nomi dei giocatori, nomi o ID di mazzi personalizzati, testo delle carte create o eventi di gioco.</p><p>RevenueCat e Apple App Store o Google Play trattano ID prodotto, acquisto, abbonamento, diritto, transazione, paese e valuta. Non riceviamo mai dati completi della carta. Per l’assistenza trattiamo e-mail e messaggio.</p><h2>4. Finalità e basi giuridiche</h2><p>I dati di acquisto sono usati per fornire e ripristinare l’accesso Pro, gestire gli abbonamenti, prevenire frodi, offrire assistenza e adempiere agli obblighi fiscali e legali. Le basi sono il contratto, il legittimo interesse alla sicurezza e gli obblighi legali.</p><h2>5. Fornitori, trasferimenti e conservazione</h2><p>Usiamo <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Devono proteggere i dati secondo questa Informativa e la legge. I trasferimenti al di fuori del SEE avvengono con garanzie adeguate. I dati restano solo per il tempo necessario ad acquisti, imposte e assistenza, o per la durata imposta dalla legge.</p><h2>6. Diritti</h2><p>Secondo la legge puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità o opposizione e reclamare a un’autorità. Scrivici.</p><h2>7. Solo adulti e modifiche</h2><p>L’App è riservata ai maggiori di 18 anni. Non la offriamo né raccogliamo consapevolmente dati di minori. Le modifiche saranno pubblicate qui con la nuova data.</p>`},
ro:{title:'Politica de Confidențialitate',label:'Limbă',updated:'Ultima actualizare:',terms:'Termeni de Utilizare',support:'Asistență',html:`<p>Această Politică explică modul în care JDG Nazar Dzys, sub numele NV Softlab („noi”), prelucrează informații în aplicația mobilă <strong>Truth or Dare</strong> („Aplicația”).</p><h2>1. Operator și contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Date pe dispozitiv</h2><p>Numele jucătorilor, preferințele, limba, progresul, notificările și textele și numele pachetelor și cărților de joc personalizate rămân local. Aplicația nu ni le încarcă. Sunt eliminate când le ștergeți sau dezinstalați/ștergeți datele Aplicației.</p><h2>3. Servicii și date</h2><p>Aplicația nu include servicii de analiză sau atribuire a instalărilor. Nu primim nume de jucători, nume sau ID-uri de pachete personalizate, textul cărților de joc create ori evenimente de joc.</p><p>RevenueCat și Apple App Store sau Google Play prelucrează ID-ul produsului, achiziția, abonamentul, dreptul, tranzacția, țara și moneda. Nu primim date complete de card. Pentru asistență prelucrăm e-mailul și mesajul.</p><h2>4. Scopuri și temeiuri juridice</h2><p>Datele de achiziție sunt folosite pentru furnizarea și restabilirea accesului Pro, gestionarea abonamentelor, prevenirea fraudei, asistență și îndeplinirea obligațiilor fiscale și legale. Temeiurile sunt contractul, interesul legitim de securitate și obligațiile legale.</p><h2>5. Furnizori, transferuri și păstrare</h2><p>Folosim <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple și Google. Ei trebuie să protejeze datele conform Politicii și legii. Transferurile în afara SEE se efectuează pe baza unor garanții adecvate. Datele sunt păstrate doar cât este necesar pentru achiziții, taxe și asistență sau cât timp impune legea.</p><h2>6. Drepturi</h2><p>Conform legii, puteți cere acces, corectare, ștergere, restricționare, portabilitate sau opoziție și depune plângere la o autoritate. Scrieți-ne.</p><h2>7. Doar adulți și modificări</h2><p>Aplicația este doar pentru persoane de cel puțin 18 ani. Nu o oferim și nu colectăm cu bună știință date de la copii. Modificările vor apărea aici cu data nouă.</p>`},
nl:{title:'Privacybeleid',label:'Taal',updated:'Laatst bijgewerkt:',terms:'Gebruiksvoorwaarden',support:'Ondersteuning',html:`<p>Dit beleid legt uit hoe JDG Nazar Dzys, handelend als NV Softlab (“wij”), informatie verwerkt in de mobiele app <strong>Truth or Dare</strong> (“App”).</p><h2>1. Verwerkingsverantwoordelijke en contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Gegevens op je apparaat</h2><p>Spelersnamen, voorkeuren, taal, voortgang, meldingen en tekst en namen van eigen decks en kaarten blijven lokaal. De App uploadt deze inhoud niet naar ons. Ze verdwijnen als je ze verwijdert of de App verwijdert/de gegevens wist.</p><h2>3. Diensten en gegevens</h2><p>De App bevat geen analyse- of installatie-attributiediensten. Wij ontvangen geen spelersnamen, namen of ID’s van eigen decks, eigen kaarttekst of spelgebeurtenissen.</p><p>RevenueCat en Apple App Store of Google Play verwerken product-ID, aankoop, abonnement, recht, transactie, land en valuta. Wij ontvangen nooit volledige kaartgegevens. Voor ondersteuning verwerken wij je e-mail en bericht.</p><h2>4. Doelen en grondslagen</h2><p>Aankoopgegevens worden gebruikt om Pro-toegang te leveren en te herstellen, abonnementen te beheren, fraude te voorkomen, ondersteuning te bieden en fiscale en wettelijke verplichtingen na te komen. De grondslagen zijn overeenkomst, gerechtvaardigd veiligheidsbelang en wettelijke verplichtingen.</p><h2>5. Providers, doorgifte en bewaring</h2><p>Wij gebruiken <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple en Google. Zij moeten gegevens volgens dit beleid en de wet beschermen. Doorgifte buiten de EER vindt plaats met passende waarborgen. Gegevens blijven alleen bewaard zolang dat nodig is voor aankopen, belastingen en ondersteuning, of zolang de wet dat vereist.</p><h2>6. Rechten</h2><p>Volgens de wet kun je toegang, correctie, verwijdering, beperking, overdracht of bezwaar vragen en klagen bij een toezichthouder. Mail ons.</p><h2>7. Alleen volwassenen en wijzigingen</h2><p>De App is alleen voor personen van 18 jaar of ouder. Wij bieden haar niet bewust aan kinderen aan en verzamelen niet bewust hun gegevens. Wijzigingen verschijnen hier met de nieuwe datum.</p>`},
tr:{title:'Gizlilik Politikası',label:'Dil',updated:'Son güncelleme:',terms:'Kullanım Koşulları',support:'Destek',html:`<p>Bu Politika, NV Softlab adıyla faaliyet gösteren JDG Nazar Dzys’in (“biz”) <strong>Truth or Dare</strong> mobil uygulamasındaki (“Uygulama”) bilgileri nasıl işlediğini açıklar.</p><h2>1. Veri sorumlusu ve iletişim</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonya<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Cihazınızdaki veriler</h2><p>Oyuncu adları, tercihler, dil, ilerleme, bildirim ayarları ve özel deste/kart adları ile metinleri yerel kalır. Uygulama bu içeriği bize yüklemez. Tek tek sildiğinizde veya Uygulamayı kaldırıp verilerini temizlediğinizde silinir.</p><h2>3. Hizmetler ve veriler</h2><p>Uygulama analiz veya kurulum ilişkilendirme hizmetleri içermez. Oyuncu adlarını, özel deste adlarını veya kimliklerini, özel kart metinlerini ya da oyun etkinliklerini almayız.</p><p>RevenueCat ve Apple App Store veya Google Play ürün ID’si, satın alma, abonelik, hak, işlem, ülke ve para birimini işler. Tam kart bilgisi almayız. Destek için e-posta ve mesajınızı işleriz.</p><h2>4. Amaçlar ve hukuki dayanaklar</h2><p>Satın alma verileri Pro erişimini sağlamak ve geri yüklemek, abonelikleri yönetmek, dolandırıcılığı önlemek, destek sunmak ve vergi ile yasal yükümlülükleri yerine getirmek için kullanılır. Dayanaklar sözleşme, güvenlik için meşru menfaat ve yasal yükümlülüklerdir.</p><h2>5. Sağlayıcılar, aktarım ve saklama</h2><p><a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple ve Google’ı kullanırız. Veriyi bu Politika ve yasaya göre korumalıdırlar. AEA dışı aktarımlar uygun güvencelere dayanır. Veriler yalnızca satın alma, vergi ve destek için gerektiği kadar veya hukuken zorunlu olduğu sürece tutulur.</p><h2>6. Haklarınız</h2><p>Yasaya göre erişim, düzeltme, silme, kısıtlama, taşınabilirlik veya itiraz talebinde bulunabilir ve denetim kurumuna şikâyette bulunabilirsiniz. Bize e-posta gönderin.</p><h2>7. Yalnızca yetişkinler ve değişiklikler</h2><p>Uygulama yalnızca 18 yaş ve üzeri içindir. Çocuklara bilerek sunmayız veya verilerini bilerek toplamayız. Değişiklikler yeni tarihle burada yayımlanır.</p>`},
cs:{title:'Zásady ochrany osobních údajů',label:'Jazyk',updated:'Poslední aktualizace:',terms:'Podmínky používání',support:'Podpora',html:`<p>Tyto zásady vysvětlují, jak JDG Nazar Dzys pod značkou NV Softlab („my“) zpracovává informace v mobilní aplikaci <strong>Truth or Dare</strong> („Aplikace“).</p><h2>1. Správce a kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polsko<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data v zařízení</h2><p>Jména hráčů, nastavení, jazyk, průběh, oznámení a texty a názvy vlastních balíčků a karet zůstávají lokálně. Aplikace je k nám nenahrává. Odstraní se jednotlivým smazáním nebo odinstalací/vymazáním dat Aplikace.</p><h2>3. Služby a údaje</h2><p>Aplikace neobsahuje analytické služby ani služby přiřazení instalací. Nezískáváme jména hráčů, názvy nebo ID vlastních balíčků, text vlastních karet ani herní události.</p><p>RevenueCat a Apple App Store nebo Google Play zpracují ID produktu, nákup, předplatné, oprávnění, transakci, zemi a měnu. Úplné údaje karty nedostáváme. Pro podporu zpracujeme e-mail a zprávu.</p><h2>4. Účely a právní základy</h2><p>Údaje o nákupech slouží k poskytnutí a obnovení přístupu Pro, správě předplatného, prevenci podvodů, podpoře uživatelů a plnění daňových a právních povinností. Základy jsou smlouva, oprávněný bezpečnostní zájem a právní povinnosti.</p><h2>5. Poskytovatelé, přenos a uchování</h2><p>Používáme <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple a Google. Musí chránit data podle těchto zásad a zákona. K přenosu mimo EHP dochází na základě vhodných záruk. Data zůstávají jen po dobu nutnou pro nákupy, daně a podporu nebo po dobu vyžadovanou zákonem.</p><h2>6. Vaše práva</h2><p>Podle zákona můžete žádat přístup, opravu, smazání, omezení, přenos nebo vznést námitku a podat stížnost úřadu. Napište nám.</p><h2>7. Jen dospělí a změny</h2><p>Aplikace je pouze pro osoby od 18 let. Vědomě ji nenabízíme dětem ani nesbíráme jejich data. Změny zveřejníme zde s novým datem.</p>`},
sv:{title:'Integritetspolicy',label:'Språk',updated:'Senast uppdaterad:',terms:'Användarvillkor',support:'Support',html:`<p>Denna policy förklarar hur JDG Nazar Dzys, under namnet NV Softlab (”vi”), behandlar information i mobilappen <strong>Truth or Dare</strong> (”Appen”).</p><h2>1. Personuppgiftsansvarig och kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data på enheten</h2><p>Spelarnamn, inställningar, språk, framsteg, aviseringar samt text och namn på egna kortlekar och kort sparas lokalt. Appen laddar inte upp innehållet till oss. Det tas bort när du raderar det eller avinstallerar/rensar Appens data.</p><h2>3. Tjänster och data</h2><p>Appen innehåller inga analys- eller installationsattribueringstjänster. Vi tar inte emot spelarnamn, namn eller ID:n för egna kortlekar, egen korttext eller spelhändelser.</p><p>RevenueCat och Apple App Store eller Google Play behandlar produkt-ID, köp, prenumeration, rättighet, transaktion, land och valuta. Vi får aldrig fullständiga kortuppgifter. För support behandlar vi din e-post och ditt meddelande.</p><h2>4. Syften och rättslig grund</h2><p>Köpdata används för att ge och återställa Pro-åtkomst, hantera prenumerationer, förebygga bedrägeri, ge support och uppfylla skatte- och rättsliga skyldigheter. Grunderna är avtal, berättigat säkerhetsintresse och rättsliga skyldigheter.</p><h2>5. Leverantörer, överföring och lagring</h2><p>Vi använder <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple och Google. De måste skydda data enligt policyn och lagen. Överföring utanför EES sker med lämpliga skyddsåtgärder. Data sparas bara så länge som behövs för köp, skatt och support eller så länge lagen kräver.</p><h2>6. Dina rättigheter</h2><p>Enligt lag kan du begära tillgång, rättelse, radering, begränsning, portabilitet eller invända och klaga hos en myndighet. Mejla oss.</p><h2>7. Endast vuxna och ändringar</h2><p>Appen är endast för personer över 18 år. Vi erbjuder den inte medvetet till barn och samlar inte medvetet in deras data. Ändringar publiceras här med nytt datum.</p>`},
ru:{title:'Политика конфиденциальности',label:'Язык',updated:'Последнее обновление:',terms:'Условия использования',support:'Поддержка',html:`<p>Эта Политика объясняет, как JDG Nazar Dzys, работающий под торговым названием NV Softlab («мы»), обрабатывает информацию в мобильном приложении <strong>Truth or Dare</strong> («Приложение»).</p><h2>1. Оператор и контакты</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Польша<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Данные на устройстве</h2><p>Имена игроков, настройки, язык, прогресс, уведомления, тексты и названия собственных колод и карточек хранятся локально. Приложение не загружает этот контент нам. Он удаляется при отдельном удалении или при удалении/очистке данных Приложения.</p><h2>3. Сервисы и данные</h2><p>Приложение не содержит сервисов аналитики или атрибуции установок. Мы не получаем имена игроков, названия или ID собственных колод, тексты собственных карточек или события игры.</p><p>RevenueCat и Apple App Store или Google Play обрабатывают ID продукта, статус покупки, подписки и доступа, транзакцию, страну и валюту. Полные данные карты мы не получаем. Для поддержки обрабатываем ваш e-mail и сообщение.</p><h2>4. Цели и правовые основания</h2><p>Данные о покупках используются для предоставления и восстановления Pro-доступа, управления подписками, предотвращения мошенничества, поддержки пользователей и выполнения налоговых и юридических обязанностей. Основания — договор, законный интерес в безопасности и юридические обязанности.</p><h2>5. Поставщики, передача и хранение</h2><p>Мы используем <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple и Google. Они должны защищать данные по этой Политике и закону. Передача за пределы ЕЭЗ осуществляется при наличии надлежащих гарантий. Данные хранятся лишь столько, сколько нужно для покупок, налогов и поддержки, или сколько того требует закон.</p><h2>6. Ваши права</h2><p>По закону вы можете запросить доступ, исправление, удаление, ограничение, переносимость или возразить и пожаловаться регулятору. Напишите нам.</p><h2>7. Только для взрослых и изменения</h2><p>Приложение предназначено только для лиц от 18 лет. Мы сознательно не предлагаем его детям и не собираем их данные. Изменения публикуются здесь с новой датой.</p>`},
da:{title:'Privatlivspolitik',label:'Sprog',updated:'Senest opdateret:',terms:'Brugsvilkår',support:'Support',html:`<p>Denne politik forklarer, hvordan JDG Nazar Dzys, der driver NV Softlab (”vi”), behandler oplysninger i mobilappen <strong>Truth or Dare</strong> (”Appen”).</p><h2>1. Dataansvarlig og kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data på enheden</h2><p>Spillernavne, indstillinger, sprog, fremskridt, notifikationer samt tekst og navne på egne kortsæt og kort gemmes lokalt. Appen uploader ikke indholdet til os. Det fjernes, når du sletter det eller afinstallerer/rydder Appens data.</p><h2>3. Tjenester og data</h2><p>Appen indeholder ingen analyse- eller installationsattribueringstjenester. Vi modtager ikke spillernavne, navne eller ID’er på egne kortsæt, egen korttekst eller spilhændelser.</p><p>RevenueCat og Apple App Store eller Google Play behandler produkt-ID, køb, abonnement, rettighed, transaktion, land og valuta. Vi modtager aldrig fulde kortoplysninger. Til support behandler vi din e-mail og besked.</p><h2>4. Formål og retsgrundlag</h2><p>Købsdata bruges til at levere og gendanne Pro-adgang, administrere abonnementer, forebygge svindel, yde support og opfylde skatte- og retlige forpligtelser. Grundlagene er kontrakt, legitim sikkerhedsinteresse og retlige forpligtelser.</p><h2>5. Leverandører, overførsel og opbevaring</h2><p>Vi bruger <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple og Google. De skal beskytte data efter denne politik og loven. Overførsel uden for EØS sker med passende garantier. Data gemmes kun så længe, som køb, skat, support eller lov kræver.</p><h2>6. Dine rettigheder</h2><p>Efter loven kan du bede om indsigt, rettelse, sletning, begrænsning, portabilitet eller gøre indsigelse og klage til en myndighed. Send os en e-mail.</p><h2>7. Kun voksne og ændringer</h2><p>Appen er kun for personer på 18 år eller derover. Vi tilbyder den ikke bevidst til børn og indsamler ikke bevidst deres data. Ændringer offentliggøres her med ny dato.</p>`}

function locale(){const q=new URLSearchParams(location.search).get('lang');if(copy[q])return q;const raw=(navigator.language||'en').replace('-','_');return copy[raw]?raw:(copy[raw.split('_')[0]]?raw.split('_')[0]:'en')}
function show(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang.replace('_','-');document.title=`${c.title} — Truth or Dare`;document.getElementById('title').textContent=c.title;document.getElementById('language-label').textContent=c.label;document.getElementById('updated-label').textContent=c.updated;document.getElementById('content').innerHTML=c.html;const terms=document.getElementById('terms');const support=document.getElementById('support');terms.textContent=c.terms;support.textContent=c.support;terms.href=`../terms-of-use/?lang=${encodeURIComponent(lang)}`;support.href=`../support/?lang=${encodeURIComponent(lang)}`;select.value=lang;const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState({},'',u)}
select.addEventListener('change',()=>show(select.value));show(locale());
