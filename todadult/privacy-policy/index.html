en:{title:'Privacy Policy',label:'Language',updated:'Last updated:',terms:'Terms of Use',support:'Support',html:`<p>This Policy explains how JDG Nazar Dzys, trading as NV Softlab (“we”), handles information in the <strong>Truth or Dare</strong> mobile app (“App”).</p><h2>1. Controller and contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Poland<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data kept on your device</h2><p>Player names, preferences, language, progress, notification settings, and the text and names of custom decks and cards are stored locally. The App does not upload that custom content to us. It is removed when you delete it individually or uninstall/clear the App’s data.</p><h2>3. Services and data they process</h2><p>Firebase provides anonymous app authentication and, only if you opt in, analytics. AppsFlyer provides optional install attribution. These services may process an anonymous app or installation identifier, device/OS, App version, language, and usage events. We do not send player names, custom deck names, custom IDs, or custom card text in analytics.</p><p>RevenueCat and Apple App Store or Google Play process product IDs, purchase and subscription status, entitlement, transaction, country, and currency information. We never receive full payment-card details. If you email us, we process your address and message to answer you.</p><h2>4. Choice, purposes, and legal bases</h2><p>Anonymous analytics and attribution are off by default. You can enable or disable them at any time under Settings → Share anonymous usage data; declining does not limit the App. We use enabled data to measure installs, understand aggregate use, improve reliability, and prevent fraud. Legal bases are consent for optional analytics/attribution, contract for App and purchase features, legitimate interests for security, and legal obligations for tax and compliance.</p><h2>5. Providers, transfers, and retention</h2><p>Providers are <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple, and Google. They must protect data consistently with this Policy and applicable law. Some processing may occur outside the EEA under adequacy decisions or safeguards such as Standard Contractual Clauses. Analytics, attribution, purchase, tax, and support records are retained under provider settings and only as long as needed for these purposes or law.</p><h2>6. Your rights</h2><p>Depending on law, you may request access, correction, deletion, restriction, portability, or object; withdraw consent in App settings; and complain to a supervisory authority. Email us to exercise a right. We may request enough information to verify and fulfil it.</p><h2>7. Adults only and changes</h2><p>The App is for adults aged 18 or older. We do not knowingly offer it to children or knowingly collect their personal data. We may update this Policy when the App, providers, or law changes; the current version and date remain on this page.</p>`},
de:{title:'Datenschutzerklärung',label:'Sprache',updated:'Zuletzt aktualisiert:',terms:'Nutzungsbedingungen',support:'Support',html:`<p>Diese Erklärung beschreibt, wie JDG Nazar Dzys, handelnd als NV Softlab („wir“), Informationen in der mobilen App <strong>Truth or Dare</strong> („App“) verarbeitet.</p><h2>1. Verantwortlicher und Kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Daten auf deinem Gerät</h2><p>Spielernamen, Einstellungen, Sprache, Fortschritt, Benachrichtigungseinstellungen sowie Texte und Namen eigener Decks und Karten bleiben lokal. Die App lädt diese eigenen Inhalte nicht zu uns hoch. Sie werden gelöscht, wenn du sie einzeln löschst oder die App deinstallierst bzw. ihre Daten löschst.</p><h2>3. Dienste und verarbeitete Daten</h2><p>Firebase bietet anonyme App-Authentifizierung und nur nach deiner Einwilligung Analysen. AppsFlyer bietet optionale Installationszuordnung. Dabei können anonyme App-/Installationskennungen, Gerät/OS, App-Version, Sprache und Nutzungsereignisse verarbeitet werden. Spielernamen, Namen oder IDs eigener Decks und Texte eigener Karten senden wir nicht an die Analyse.</p><p>RevenueCat sowie Apple App Store oder Google Play verarbeiten Produkt-IDs, Kauf-, Abo- und Berechtigungsstatus, Transaktion, Land und Währung. Vollständige Kartendaten erhalten wir nie. Bei E-Mail-Support verarbeiten wir Adresse und Nachricht zur Antwort.</p><h2>4. Wahl, Zwecke und Rechtsgrundlagen</h2><p>Anonyme Analyse und Zuordnung sind standardmäßig aus. Unter Einstellungen → Anonyme Nutzungsdaten teilen kannst du sie jederzeit ein- oder ausschalten; eine Ablehnung schränkt die App nicht ein. Grundlagen sind Einwilligung, Vertrag, berechtigte Sicherheitsinteressen und gesetzliche Pflichten.</p><h2>5. Anbieter, Übermittlung und Speicherung</h2><p>Anbieter sind <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple und Google. Sie müssen Daten nach dieser Erklärung und geltendem Recht schützen. Übermittlungen außerhalb des EWR erfolgen mit zulässigen Garantien. Daten bleiben nur so lange gespeichert, wie es für Analyse, Käufe, Steuern, Support oder gesetzliche Pflichten nötig ist.</p><h2>6. Deine Rechte</h2><p>Du kannst je nach Recht Auskunft, Berichtigung, Löschung, Einschränkung, Übertragbarkeit oder Widerspruch verlangen, Einwilligung in den App-Einstellungen widerrufen und dich bei einer Aufsichtsbehörde beschweren. Kontaktiere uns per E-Mail.</p><h2>7. Nur Erwachsene und Änderungen</h2><p>Die App ist nur für Personen ab 18 Jahren. Wir richten sie nicht wissentlich an Kinder und erfassen nicht wissentlich deren personenbezogene Daten. Änderungen erscheinen mit aktuellem Datum auf dieser Seite.</p>`},
es:{title:'Política de Privacidad',label:'Idioma',updated:'Última actualización:',terms:'Términos de Uso',support:'Soporte',html:`<p>Esta Política explica cómo JDG Nazar Dzys, que opera como NV Softlab («nosotros»), trata la información en la aplicación móvil <strong>Truth or Dare</strong> («App»).</p><h2>1. Responsable y contacto</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Datos guardados en tu dispositivo</h2><p>Los nombres de jugadores, preferencias, idioma, progreso, ajustes de notificaciones y los textos y nombres de barajas y cartas personalizadas se guardan localmente. La App no nos los sube. Se eliminan al borrarlos individualmente o al desinstalar/borrar los datos de la App.</p><h2>3. Servicios y datos tratados</h2><p>Firebase ofrece autenticación anónima y, solo con tu consentimiento, analítica. AppsFlyer ofrece atribución de instalaciones opcional. Pueden tratar un identificador anónimo de app/instalación, dispositivo/SO, versión, idioma y eventos de uso. No enviamos a la analítica nombres de jugadores, nombres o ID personalizados ni texto de cartas propias.</p><p>RevenueCat y Apple App Store o Google Play tratan ID de producto, estado de compra, suscripción y acceso, transacción, país y moneda. Nunca recibimos datos completos de tarjeta. Para soporte tratamos tu correo y mensaje.</p><h2>4. Elección, fines y bases jurídicas</h2><p>La analítica y atribución anónimas están desactivadas por defecto. Puedes activarlas o retirarlas en Ajustes → Compartir datos de uso anónimos sin limitar la App. Las bases son consentimiento, contrato, interés legítimo en seguridad y obligaciones legales.</p><h2>5. Proveedores, transferencias y conservación</h2><p>Usamos <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple y Google. Deben proteger los datos conforme a esta Política y la ley. Las transferencias fuera del EEE usan garantías válidas. Los registros se conservan solo durante el tiempo necesario para analítica, compras, impuestos, soporte o la ley.</p><h2>6. Tus derechos</h2><p>Según la ley, puedes pedir acceso, rectificación, supresión, limitación, portabilidad u oposición; retirar el consentimiento en Ajustes; y reclamar ante una autoridad. Escríbenos para ejercerlos.</p><h2>7. Solo adultos y cambios</h2><p>La App es solo para mayores de 18 años. No la ofrecemos ni recopilamos conscientemente datos de menores. Las actualizaciones se publicarán aquí con la fecha vigente.</p>`},
fr:{title:'Politique de Confidentialité',label:'Langue',updated:'Dernière mise à jour :',terms:'Conditions d’Utilisation',support:'Assistance',html:`<p>Cette Politique explique comment JDG Nazar Dzys, exerçant sous le nom NV Softlab (« nous »), traite les informations dans l’application mobile <strong>Truth or Dare</strong> (« App »).</p><h2>1. Responsable et contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Pologne<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Données conservées sur votre appareil</h2><p>Les noms des joueurs, préférences, langue, progression, réglages de notifications ainsi que les textes et noms de paquets et cartes personnalisés restent en local. L’App ne nous transmet pas ces contenus. Ils disparaissent lorsque vous les supprimez ou désinstallez/effacez les données de l’App.</p><h2>3. Services et données traitées</h2><p>Firebase fournit l’authentification anonyme et, uniquement avec votre accord, l’analyse. AppsFlyer fournit l’attribution facultative des installations. Ils peuvent traiter un identifiant anonyme, l’appareil/OS, la version, la langue et des événements d’usage. Nous n’envoyons pas à l’analyse les noms des joueurs, noms ou identifiants personnalisés, ni le texte des cartes créées.</p><p>RevenueCat et l’App Store d’Apple ou Google Play traitent les identifiants de produits, achats, abonnements, droits, transactions, pays et devise. Nous ne recevons jamais vos données bancaires complètes. Pour l’assistance, nous traitons votre e-mail et votre message.</p><h2>4. Choix, finalités et bases légales</h2><p>L’analyse et l’attribution anonymes sont désactivées par défaut. Vous pouvez les activer ou retirer votre accord dans Réglages → Partager des données d’utilisation anonymes, sans limiter l’App. Les bases sont le consentement, le contrat, l’intérêt légitime de sécurité et les obligations légales.</p><h2>5. Prestataires, transferts et conservation</h2><p>Nous utilisons <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple et Google. Ils doivent protéger les données conformément à cette Politique et au droit applicable. Les transferts hors EEE reposent sur des garanties reconnues. Les données ne sont gardées que le temps requis pour l’analyse, les achats, la fiscalité, l’assistance ou la loi.</p><h2>6. Vos droits</h2><p>Selon la loi, vous pouvez demander accès, rectification, effacement, limitation, portabilité ou opposition, retirer votre consentement dans les réglages et saisir une autorité. Écrivez-nous pour les exercer.</p><h2>7. Adultes uniquement et modifications</h2><p>L’App est réservée aux personnes de 18 ans ou plus. Nous ne la proposons pas sciemment aux enfants et ne collectons pas sciemment leurs données. Toute mise à jour sera publiée ici avec sa date.</p>`},
pl:{title:'Polityka Prywatności',label:'Język',updated:'Ostatnia aktualizacja:',terms:'Warunki Użytkowania',support:'Pomoc',html:`<p>Niniejsza Polityka wyjaśnia, jak JDG Nazar Dzys, działający jako NV Softlab („my”), przetwarza informacje w aplikacji mobilnej <strong>Truth or Dare</strong> („Aplikacja”).</p><h2>1. Administrator i kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polska<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dane na Twoim urządzeniu</h2><p>Imiona graczy, ustawienia, język, postęp, ustawienia powiadomień oraz teksty i nazwy własnych talii i kart są przechowywane lokalnie. Aplikacja nie przesyła nam tych treści. Znikają po ich osobnym usunięciu albo odinstalowaniu/wyczyszczeniu danych Aplikacji.</p><h2>3. Usługi i przetwarzane dane</h2><p>Firebase zapewnia anonimowe uwierzytelnianie, a wyłącznie za Twoją zgodą — analitykę. AppsFlyer zapewnia opcjonalną atrybucję instalacji. Mogą przetwarzać anonimowy identyfikator aplikacji/instalacji, urządzenie/system, wersję, język i zdarzenia użycia. Do analityki nie wysyłamy imion graczy, nazw ani ID własnych talii ani tekstu własnych kart.</p><p>RevenueCat oraz Apple App Store lub Google Play przetwarzają ID produktów, status zakupu, subskrypcji i uprawnień, transakcję, kraj i walutę. Nigdy nie otrzymujemy pełnych danych karty. W sprawach pomocy przetwarzamy Twój e-mail i wiadomość.</p><h2>4. Wybór, cele i podstawy prawne</h2><p>Anonimowa analityka i atrybucja są domyślnie wyłączone. Możesz je włączyć lub wycofać zgodę w Ustawienia → Udostępniaj anonimowe dane o użyciu, bez ograniczenia Aplikacji. Podstawami są zgoda, umowa, uzasadniony interes bezpieczeństwa i obowiązki prawne.</p><h2>5. Dostawcy, transfery i przechowywanie</h2><p>Korzystamy z <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple i Google. Muszą chronić dane zgodnie z tą Polityką i prawem. Transfery poza EOG opierają się na właściwych zabezpieczeniach. Dane przechowuje się tylko tak długo, jak wymaga analityka, zakupy, podatki, pomoc lub prawo.</p><h2>6. Twoje prawa</h2><p>Zależnie od prawa możesz żądać dostępu, poprawienia, usunięcia, ograniczenia, przeniesienia lub sprzeciwu, wycofać zgodę w ustawieniach i złożyć skargę do organu nadzorczego. Napisz do nas, by skorzystać z praw.</p><h2>7. Tylko dorośli i zmiany</h2><p>Aplikacja jest tylko dla osób w wieku co najmniej 18 lat. Świadomie nie oferujemy jej dzieciom ani nie zbieramy ich danych. Zmiany opublikujemy tutaj z aktualną datą.</p>`},
uk:{title:'Політика конфіденційності',label:'Мова',updated:'Останнє оновлення:',terms:'Умови використання',support:'Підтримка',html:`<p>Ця Політика пояснює, як JDG Nazar Dzys, що працює як NV Softlab («ми»), обробляє інформацію в мобільному застосунку <strong>Truth or Dare</strong> («Застосунок»).</p><h2>1. Контролер і контакти</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Польща<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Дані на вашому пристрої</h2><p>Імена гравців, налаштування, мова, прогрес, параметри сповіщень, а також тексти й назви власних колод і карт зберігаються локально. Застосунок не надсилає нам цей вміст. Він видаляється, коли ви видаляєте його окремо або деінсталюєте/очищуєте дані Застосунку.</p><h2>3. Сервіси та дані</h2><p>Firebase забезпечує анонімну автентифікацію та, лише за вашою згодою, аналітику. AppsFlyer надає необов’язкову атрибуцію встановлень. Вони можуть обробляти анонімний ID застосунку/встановлення, пристрій/ОС, версію, мову й події використання. Ми не передаємо в аналітику імена гравців, назви чи ID власних колод або текст власних карт.</p><p>RevenueCat і Apple App Store чи Google Play обробляють ID продукту, статус покупки, підписки й доступу, транзакцію, країну та валюту. Повні дані платіжної картки ми не отримуємо. Для підтримки обробляємо вашу адресу й повідомлення.</p><h2>4. Вибір, цілі й правові підстави</h2><p>Анонімна аналітика й атрибуція типово вимкнені. Їх можна ввімкнути чи відкликати згоду в Налаштування → Ділитися анонімними даними про використання без обмеження Застосунку. Підстави: згода, договір, законний інтерес у безпеці та юридичні обов’язки.</p><h2>5. Постачальники, передавання й зберігання</h2><p>Ми використовуємо <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple і Google. Вони мають захищати дані відповідно до цієї Політики й закону. Передавання за межі ЄЕЗ здійснюється з належними гарантіями. Дані зберігаються лише стільки, скільки потрібно для аналітики, покупок, податків, підтримки або закону.</p><h2>6. Ваші права</h2><p>Залежно від закону ви можете вимагати доступу, виправлення, видалення, обмеження, перенесення чи заперечити; відкликати згоду в налаштуваннях; поскаржитися наглядовому органу. Напишіть нам для реалізації прав.</p><h2>7. Лише для дорослих і зміни</h2><p>Застосунок призначено лише для осіб від 18 років. Ми свідомо не пропонуємо його дітям і не збираємо їхні дані. Оновлення публікуватимуться тут із новою датою.</p>`},
pt:{title:'Política de Privacidade',label:'Idioma',updated:'Última atualização:',terms:'Termos de Utilização',support:'Apoio',html:`<p>Esta Política explica como JDG Nazar Dzys, sob a marca NV Softlab («nós»), trata informações na aplicação móvel <strong>Truth or Dare</strong> («Aplicação»).</p><h2>1. Responsável e contacto</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polónia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dados no dispositivo</h2><p>Nomes de jogadores, preferências, idioma, progresso, notificações e textos e nomes de baralhos e cartas personalizados ficam localmente. A Aplicação não nos envia esse conteúdo. É removido quando o apaga ou desinstala/limpa os dados da Aplicação.</p><h2>3. Serviços e dados tratados</h2><p>Firebase fornece autenticação anónima e, apenas com consentimento, análise. AppsFlyer fornece atribuição opcional. Podem tratar ID anónimo, dispositivo/SO, versão, idioma e eventos de utilização. Não enviamos nomes de jogadores, nomes ou ID personalizados nem texto das cartas para análise.</p><p>RevenueCat e Apple App Store ou Google Play tratam ID do produto, compra, subscrição, direito, transação, país e moeda. Nunca recebemos dados completos do cartão. Para apoio tratamos o seu e-mail e mensagem.</p><h2>4. Escolha, fins e bases legais</h2><p>Análise e atribuição estão desativadas por defeito. Pode ativar ou retirar consentimento em Definições → Partilhar dados de utilização anónimos, sem limitar a Aplicação. As bases são consentimento, contrato, interesse legítimo de segurança e obrigações legais.</p><h2>5. Fornecedores, transferências e retenção</h2><p>Usamos <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Devem proteger os dados segundo esta Política e a lei. Transferências fora do EEE usam garantias adequadas. Os dados ficam apenas enquanto necessários para análise, compras, impostos, apoio ou lei.</p><h2>6. Direitos</h2><p>Conforme a lei, pode pedir acesso, correção, eliminação, limitação, portabilidade ou oposição, retirar consentimento nas definições e reclamar a uma autoridade. Contacte-nos por e-mail.</p><h2>7. Só adultos e alterações</h2><p>A Aplicação destina-se apenas a maiores de 18 anos. Não a oferecemos nem recolhemos conscientemente dados de crianças. Alterações serão publicadas aqui com a data atual.</p>`},
pt_BR:{title:'Política de Privacidade',label:'Idioma',updated:'Última atualização:',terms:'Termos de Uso',support:'Suporte',html:`<p>Esta Política explica como JDG Nazar Dzys, sob a marca NV Softlab (“nós”), trata informações no aplicativo móvel <strong>Truth or Dare</strong> (“Aplicativo”).</p><h2>1. Controlador e contato</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polônia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dados no aparelho</h2><p>Nomes de jogadores, preferências, idioma, progresso, notificações e textos e nomes de baralhos e cartas personalizados ficam armazenados localmente. O Aplicativo não nos envia esse conteúdo. Ele é removido quando você o exclui ou desinstala/limpa os dados do Aplicativo.</p><h2>3. Serviços e dados tratados</h2><p>O Firebase oferece autenticação anônima e, somente com consentimento, análise. O AppsFlyer oferece atribuição opcional. Eles podem tratar ID anônimo, aparelho/SO, versão, idioma e eventos de uso. Não enviamos nomes de jogadores, nomes ou IDs personalizados nem texto das cartas para análise.</p><p>RevenueCat e Apple App Store ou Google Play tratam ID do produto, compra, assinatura, direito, transação, país e moeda. Nunca recebemos dados completos do cartão. Para suporte tratamos seu e-mail e mensagem.</p><h2>4. Escolha, finalidades e bases legais</h2><p>Análise e atribuição ficam desativadas por padrão. Você pode ativar ou retirar o consentimento em Ajustes → Compartilhar dados de uso anônimos, sem limitar o Aplicativo. As bases são consentimento, contrato, interesse legítimo de segurança e obrigações legais.</p><h2>5. Fornecedores, transferências e retenção</h2><p>Usamos <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Eles devem proteger os dados conforme esta Política e a lei. Transferências internacionais usam garantias adequadas. Dados ficam somente enquanto necessários para análise, compras, impostos, suporte ou lei.</p><h2>6. Direitos</h2><p>Conforme a lei, você pode pedir acesso, correção, exclusão, limitação, portabilidade ou oposição, retirar consentimento nos ajustes e reclamar a uma autoridade. Fale conosco por e-mail.</p><h2>7. Somente adultos e alterações</h2><p>O Aplicativo destina-se apenas a maiores de 18 anos. Não o oferecemos nem coletamos conscientemente dados de crianças. Alterações serão publicadas aqui com a data atual.</p>`},
hu:{title:'Adatvédelmi szabályzat',label:'Nyelv',updated:'Utolsó frissítés:',terms:'Felhasználási feltételek',support:'Támogatás',html:`<p>Ez a Szabályzat ismerteti, hogyan kezeli a JDG Nazar Dzys, NV Softlab néven („mi”) az adatokat a <strong>Truth or Dare</strong> mobilalkalmazásban („Alkalmazás”).</p><h2>1. Adatkezelő és kapcsolat</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Lengyelország<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Az eszközön tárolt adatok</h2><p>A játékosnevek, beállítások, nyelv, haladás, értesítések, valamint az egyéni paklik és kártyák neve és szövege helyben marad. Az Alkalmazás ezt nem tölti fel hozzánk. Egyenkénti törléskor vagy az Alkalmazás eltávolításakor/adatainak törlésekor megszűnik.</p><h2>3. Szolgáltatások és adatok</h2><p>A Firebase névtelen hitelesítést, és csak hozzájárulással elemzést biztosít. Az AppsFlyer választható telepítési hozzárendelést végez. Névtelen azonosítót, eszközt/OS-t, verziót, nyelvet és használati eseményeket kezelhetnek. Játékosnevet, egyéni nevet vagy ID-t és kártyaszöveget nem küldünk elemzésre.</p><p>A RevenueCat és az Apple App Store vagy Google Play termék-, vásárlási, előfizetési, jogosultsági, tranzakciós, ország- és pénznemadatokat kezel. Teljes bankkártyaadatot nem kapunk. Támogatáskor az e-mailt és üzenetet kezeljük.</p><h2>4. Választás, cél és jogalap</h2><p>Az elemzés és hozzárendelés alapból ki van kapcsolva. A Beállítások → Névtelen használati adatok megosztása alatt bármikor engedélyezhető vagy visszavonható, az Alkalmazás korlátozása nélkül. Jogalap: hozzájárulás, szerződés, jogos biztonsági érdek és jogi kötelezettség.</p><h2>5. Szolgáltatók, továbbítás, megőrzés</h2><p>Szolgáltatók: <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple és Google. Az adatokat e Szabályzat és a jog szerint kell védeniük. EGT-n kívüli továbbítás megfelelő garanciákkal történik. Az adatokat csak a szükséges elemzési, vásárlási, adózási, támogatási vagy jogi ideig őrzik.</p><h2>6. Jogok</h2><p>A jog szerint hozzáférést, helyesbítést, törlést, korlátozást, hordozhatóságot vagy tiltakozást kérhet, visszavonhatja hozzájárulását és hatósághoz fordulhat. Írjon nekünk.</p><h2>7. Csak felnőttek és változások</h2><p>Az Alkalmazás kizárólag 18 éven felülieknek szól. Tudatosan nem kínáljuk gyermekeknek és nem gyűjtjük adataikat. A változásokat új dátummal itt közöljük.</p>`},
id:{title:'Kebijakan Privasi',label:'Bahasa',updated:'Terakhir diperbarui:',terms:'Ketentuan Penggunaan',support:'Dukungan',html:`<p>Kebijakan ini menjelaskan cara JDG Nazar Dzys, dengan nama NV Softlab (“kami”), menangani informasi dalam aplikasi seluler <strong>Truth or Dare</strong> (“Aplikasi”).</p><h2>1. Pengendali dan kontak</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polandia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data di perangkat</h2><p>Nama pemain, preferensi, bahasa, progres, pengaturan notifikasi, serta teks dan nama dek dan kartu buatan disimpan secara lokal. Aplikasi tidak mengunggah konten itu kepada kami. Data hilang saat dihapus satu per satu atau saat Aplikasi dicopot/datanya dibersihkan.</p><h2>3. Layanan dan data</h2><p>Firebase menyediakan autentikasi anonim dan, hanya dengan persetujuan, analitik. AppsFlyer menyediakan atribusi pemasangan opsional. Keduanya dapat memproses ID anonim, perangkat/OS, versi, bahasa, dan peristiwa penggunaan. Kami tidak mengirim nama pemain, nama atau ID buatan, maupun teks kartu buatan ke analitik.</p><p>RevenueCat dan Apple App Store atau Google Play memproses ID produk, status pembelian, langganan, hak akses, transaksi, negara, dan mata uang. Kami tidak menerima detail kartu lengkap. Untuk dukungan, kami memproses email dan pesan Anda.</p><h2>4. Pilihan, tujuan, dan dasar hukum</h2><p>Analitik dan atribusi dinonaktifkan secara default. Anda dapat mengaktifkan atau menarik persetujuan di Pengaturan → Bagikan data penggunaan anonim tanpa membatasi Aplikasi. Dasarnya adalah persetujuan, kontrak, kepentingan keamanan yang sah, dan kewajiban hukum.</p><h2>5. Penyedia, transfer, dan penyimpanan</h2><p>Kami memakai <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple, dan Google. Mereka wajib melindungi data sesuai Kebijakan ini dan hukum. Transfer internasional memakai perlindungan yang sesuai. Data disimpan hanya selama dibutuhkan untuk analitik, pembelian, pajak, dukungan, atau hukum.</p><h2>6. Hak Anda</h2><p>Sesuai hukum, Anda dapat meminta akses, koreksi, penghapusan, pembatasan, portabilitas, atau keberatan, menarik persetujuan di Pengaturan, dan mengadu ke otoritas. Hubungi kami lewat email.</p><h2>7. Khusus dewasa dan perubahan</h2><p>Aplikasi hanya untuk usia 18 tahun ke atas. Kami tidak sengaja menawarkannya kepada anak atau mengumpulkan data mereka. Perubahan akan diterbitkan di sini dengan tanggal baru.</p>`},
it:{title:'Informativa sulla Privacy',label:'Lingua',updated:'Ultimo aggiornamento:',terms:'Termini di Utilizzo',support:'Assistenza',html:`<p>Questa Informativa spiega come JDG Nazar Dzys, operante come NV Softlab (“noi”), tratta le informazioni nell’app mobile <strong>Truth or Dare</strong> (“App”).</p><h2>1. Titolare e contatti</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Dati sul dispositivo</h2><p>Nomi dei giocatori, preferenze, lingua, progressi, notifiche e testi e nomi di mazzi e carte personalizzati restano in locale. L’App non ci carica tali contenuti. Sono rimossi quando li elimini o disinstalli/cancelli i dati dell’App.</p><h2>3. Servizi e dati trattati</h2><p>Firebase fornisce autenticazione anonima e, solo con consenso, analisi. AppsFlyer offre attribuzione facoltativa delle installazioni. Possono trattare un ID anonimo, dispositivo/OS, versione, lingua ed eventi d’uso. Non inviamo all’analisi nomi dei giocatori, nomi o ID personalizzati né testo delle carte create.</p><p>RevenueCat e Apple App Store o Google Play trattano ID prodotto, acquisto, abbonamento, diritto, transazione, paese e valuta. Non riceviamo mai dati completi della carta. Per l’assistenza trattiamo e-mail e messaggio.</p><h2>4. Scelta, finalità e basi giuridiche</h2><p>Analisi e attribuzione sono disattivate per impostazione predefinita. Puoi attivarle o revocare il consenso in Impostazioni → Condividi dati di utilizzo anonimi senza limitare l’App. Le basi sono consenso, contratto, legittimo interesse alla sicurezza e obblighi legali.</p><h2>5. Fornitori, trasferimenti e conservazione</h2><p>Usiamo <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple e Google. Devono proteggere i dati secondo questa Informativa e la legge. I trasferimenti fuori SEE usano garanzie adeguate. I dati restano solo quanto necessario per analisi, acquisti, imposte, assistenza o legge.</p><h2>6. Diritti</h2><p>Secondo la legge puoi chiedere accesso, rettifica, cancellazione, limitazione, portabilità o opposizione, revocare il consenso nelle impostazioni e reclamare a un’autorità. Scrivici.</p><h2>7. Solo adulti e modifiche</h2><p>L’App è riservata ai maggiori di 18 anni. Non la offriamo né raccogliamo consapevolmente dati di minori. Le modifiche saranno pubblicate qui con la nuova data.</p>`},
ro:{title:'Politica de Confidențialitate',label:'Limbă',updated:'Ultima actualizare:',terms:'Termeni de Utilizare',support:'Asistență',html:`<p>Această Politică explică modul în care JDG Nazar Dzys, sub numele NV Softlab („noi”), prelucrează informații în aplicația mobilă <strong>Truth or Dare</strong> („Aplicația”).</p><h2>1. Operator și contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonia<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Date pe dispozitiv</h2><p>Numele jucătorilor, preferințele, limba, progresul, notificările și textele și numele pachetelor și cardurilor personalizate rămân local. Aplicația nu ni le încarcă. Sunt eliminate când le ștergeți sau dezinstalați/ștergeți datele Aplicației.</p><h2>3. Servicii și date</h2><p>Firebase oferă autentificare anonimă și, doar cu acordul dvs., analiză. AppsFlyer oferă atribuire opțională. Pot prelucra un ID anonim, dispozitiv/SO, versiune, limbă și evenimente de utilizare. Nu trimitem în analiză nume de jucători, nume sau ID-uri personalizate ori textul cardurilor create.</p><p>RevenueCat și Apple App Store sau Google Play prelucrează ID-ul produsului, achiziția, abonamentul, dreptul, tranzacția, țara și moneda. Nu primim date complete de card. Pentru asistență prelucrăm e-mailul și mesajul.</p><h2>4. Alegere, scopuri și temeiuri</h2><p>Analiza și atribuirea sunt oprite implicit. Le puteți activa sau retrage acordul în Setări → Partajează date anonime de utilizare, fără limitarea Aplicației. Temeiurile sunt consimțământul, contractul, interesul legitim de securitate și obligațiile legale.</p><h2>5. Furnizori, transferuri și păstrare</h2><p>Folosim <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple și Google. Ei trebuie să protejeze datele conform Politicii și legii. Transferurile în afara SEE folosesc garanții adecvate. Datele sunt păstrate doar cât este necesar pentru analiză, achiziții, taxe, asistență sau lege.</p><h2>6. Drepturi</h2><p>Conform legii, puteți cere acces, corectare, ștergere, restricționare, portabilitate sau opoziție, retrage acordul în setări și depune plângere la o autoritate. Scrieți-ne.</p><h2>7. Doar adulți și modificări</h2><p>Aplicația este doar pentru persoane de cel puțin 18 ani. Nu o oferim și nu colectăm cu bună știință date de la copii. Modificările vor apărea aici cu data nouă.</p>`},
nl:{title:'Privacybeleid',label:'Taal',updated:'Laatst bijgewerkt:',terms:'Gebruiksvoorwaarden',support:'Ondersteuning',html:`<p>Dit beleid legt uit hoe JDG Nazar Dzys, handelend als NV Softlab (“wij”), informatie verwerkt in de mobiele app <strong>Truth or Dare</strong> (“App”).</p><h2>1. Verwerkingsverantwoordelijke en contact</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Gegevens op je apparaat</h2><p>Spelersnamen, voorkeuren, taal, voortgang, meldingen en tekst en namen van eigen decks en kaarten blijven lokaal. De App uploadt deze inhoud niet naar ons. Ze verdwijnen als je ze verwijdert of de App verwijdert/de gegevens wist.</p><h2>3. Diensten en gegevens</h2><p>Firebase biedt anonieme authenticatie en alleen met toestemming analyses. AppsFlyer biedt optionele installatie-attributie. Zij kunnen een anonieme ID, apparaat/OS, versie, taal en gebruiksgebeurtenissen verwerken. Wij sturen geen spelersnamen, eigen namen of ID’s of kaarttekst naar analyses.</p><p>RevenueCat en Apple App Store of Google Play verwerken product-ID, aankoop, abonnement, recht, transactie, land en valuta. Wij ontvangen nooit volledige kaartgegevens. Voor ondersteuning verwerken wij je e-mail en bericht.</p><h2>4. Keuze, doelen en grondslagen</h2><p>Analyses en attributie staan standaard uit. Je kunt ze aanzetten of toestemming intrekken via Instellingen → Anonieme gebruiksgegevens delen zonder de App te beperken. Grondslagen zijn toestemming, overeenkomst, gerechtvaardigd veiligheidsbelang en wettelijke plichten.</p><h2>5. Providers, doorgifte en bewaring</h2><p>Wij gebruiken <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple en Google. Zij moeten gegevens volgens dit beleid en de wet beschermen. Doorgifte buiten de EER gebruikt passende waarborgen. Gegevens blijven alleen zolang nodig voor analyse, aankopen, belasting, ondersteuning of wet.</p><h2>6. Rechten</h2><p>Volgens de wet kun je toegang, correctie, verwijdering, beperking, overdracht of bezwaar vragen, toestemming in instellingen intrekken en klagen bij een toezichthouder. Mail ons.</p><h2>7. Alleen volwassenen en wijzigingen</h2><p>De App is alleen voor personen van 18 jaar of ouder. Wij bieden haar niet bewust aan kinderen aan en verzamelen niet bewust hun gegevens. Wijzigingen verschijnen hier met de nieuwe datum.</p>`},
tr:{title:'Gizlilik Politikası',label:'Dil',updated:'Son güncelleme:',terms:'Kullanım Koşulları',support:'Destek',html:`<p>Bu Politika, NV Softlab adıyla faaliyet gösteren JDG Nazar Dzys’in (“biz”) <strong>Truth or Dare</strong> mobil uygulamasındaki (“Uygulama”) bilgileri nasıl işlediğini açıklar.</p><h2>1. Veri sorumlusu ve iletişim</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polonya<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Cihazınızdaki veriler</h2><p>Oyuncu adları, tercihler, dil, ilerleme, bildirim ayarları ve özel deste/kart adları ile metinleri yerel kalır. Uygulama bu içeriği bize yüklemez. Tek tek sildiğinizde veya Uygulamayı kaldırıp verilerini temizlediğinizde silinir.</p><h2>3. Hizmetler ve veriler</h2><p>Firebase anonim kimlik doğrulama, yalnızca onayınızla analiz sağlar. AppsFlyer isteğe bağlı kurulum ilişkilendirmesi sağlar. Anonim ID, cihaz/OS, sürüm, dil ve kullanım olaylarını işleyebilirler. Oyuncu adlarını, özel ad veya ID’leri ya da özel kart metnini analize göndermeyiz.</p><p>RevenueCat ve Apple App Store veya Google Play ürün ID’si, satın alma, abonelik, hak, işlem, ülke ve para birimini işler. Tam kart bilgisi almayız. Destek için e-posta ve mesajınızı işleriz.</p><h2>4. Seçim, amaç ve hukuki dayanak</h2><p>Analiz ve ilişkilendirme varsayılan olarak kapalıdır. Ayarlar → Anonim kullanım verilerini paylaş bölümünden açabilir veya onayı geri çekebilirsiniz; reddetmek Uygulamayı kısıtlamaz. Dayanaklar onay, sözleşme, güvenlik için meşru menfaat ve yasal yükümlülüktür.</p><h2>5. Sağlayıcılar, aktarım ve saklama</h2><p><a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple ve Google’ı kullanırız. Veriyi bu Politika ve yasaya göre korumalıdırlar. AEA dışı aktarımlar uygun güvencelere dayanır. Veriler yalnızca analiz, satın alma, vergi, destek veya hukuk için gerektiği kadar tutulur.</p><h2>6. Haklarınız</h2><p>Yasaya göre erişim, düzeltme, silme, kısıtlama, taşınabilirlik veya itiraz isteyebilir, ayarlardan onayı geri çekebilir ve kuruma şikâyet edebilirsiniz. Bize e-posta gönderin.</p><h2>7. Yalnızca yetişkinler ve değişiklikler</h2><p>Uygulama yalnızca 18 yaş ve üzeri içindir. Çocuklara bilerek sunmayız veya verilerini bilerek toplamayız. Değişiklikler yeni tarihle burada yayımlanır.</p>`},
cs:{title:'Zásady ochrany osobních údajů',label:'Jazyk',updated:'Poslední aktualizace:',terms:'Podmínky používání',support:'Podpora',html:`<p>Tyto zásady vysvětlují, jak JDG Nazar Dzys pod značkou NV Softlab („my“) zpracovává informace v mobilní aplikaci <strong>Truth or Dare</strong> („Aplikace“).</p><h2>1. Správce a kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polsko<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data v zařízení</h2><p>Jména hráčů, nastavení, jazyk, průběh, oznámení a texty a názvy vlastních balíčků a karet zůstávají lokálně. Aplikace je k nám nenahrává. Odstraní se jednotlivým smazáním nebo odinstalací/vymazáním dat Aplikace.</p><h2>3. Služby a údaje</h2><p>Firebase poskytuje anonymní ověření a pouze se souhlasem analytiku. AppsFlyer poskytuje volitelné přiřazení instalace. Mohou zpracovat anonymní ID, zařízení/OS, verzi, jazyk a události používání. Do analytiky neposíláme jména hráčů, vlastní názvy či ID ani text vlastních karet.</p><p>RevenueCat a Apple App Store nebo Google Play zpracují ID produktu, nákup, předplatné, oprávnění, transakci, zemi a měnu. Úplné údaje karty nedostáváme. Pro podporu zpracujeme e-mail a zprávu.</p><h2>4. Volba, účely a právní základy</h2><p>Analytika a přiřazení jsou ve výchozím stavu vypnuté. Lze je zapnout či souhlas odvolat v Nastavení → Sdílet anonymní údaje o používání bez omezení Aplikace. Základy jsou souhlas, smlouva, oprávněný bezpečnostní zájem a právní povinnosti.</p><h2>5. Poskytovatelé, přenos a uchování</h2><p>Používáme <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple a Google. Musí chránit data podle těchto zásad a zákona. Přenos mimo EHP využívá vhodné záruky. Data zůstávají jen po dobu nutnou pro analytiku, nákupy, daně, podporu či zákon.</p><h2>6. Vaše práva</h2><p>Podle zákona můžete žádat přístup, opravu, smazání, omezení, přenos nebo vznést námitku, odvolat souhlas v nastavení a podat stížnost úřadu. Napište nám.</p><h2>7. Jen dospělí a změny</h2><p>Aplikace je pouze pro osoby od 18 let. Vědomě ji nenabízíme dětem ani nesbíráme jejich data. Změny zveřejníme zde s novým datem.</p>`},
sv:{title:'Integritetspolicy',label:'Språk',updated:'Senast uppdaterad:',terms:'Användarvillkor',support:'Support',html:`<p>Denna policy förklarar hur JDG Nazar Dzys, under namnet NV Softlab (”vi”), behandlar information i mobilappen <strong>Truth or Dare</strong> (”Appen”).</p><h2>1. Personuppgiftsansvarig och kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data på enheten</h2><p>Spelarnamn, inställningar, språk, framsteg, aviseringar samt text och namn på egna kortlekar och kort sparas lokalt. Appen laddar inte upp innehållet till oss. Det tas bort när du raderar det eller avinstallerar/rensar Appens data.</p><h2>3. Tjänster och data</h2><p>Firebase ger anonym autentisering och endast med samtycke analys. AppsFlyer ger valfri installationsattribuering. De kan behandla anonymt ID, enhet/OS, version, språk och användningshändelser. Vi skickar inte spelarnamn, egna namn eller ID:n eller egen korttext till analys.</p><p>RevenueCat och Apple App Store eller Google Play behandlar produkt-ID, köp, prenumeration, rättighet, transaktion, land och valuta. Vi får aldrig fullständiga kortuppgifter. För support behandlar vi din e-post och ditt meddelande.</p><h2>4. Val, syfte och rättslig grund</h2><p>Analys och attribuering är av som standard. Du kan slå på dem eller återkalla samtycke under Inställningar → Dela anonyma användningsdata utan att begränsa Appen. Grunderna är samtycke, avtal, berättigat säkerhetsintresse och rättsliga skyldigheter.</p><h2>5. Leverantörer, överföring och lagring</h2><p>Vi använder <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple och Google. De måste skydda data enligt policyn och lagen. Överföring utanför EES använder lämpliga skydd. Data sparas bara så länge som behövs för analys, köp, skatt, support eller lag.</p><h2>6. Dina rättigheter</h2><p>Enligt lag kan du begära tillgång, rättelse, radering, begränsning, portabilitet eller invända, återkalla samtycke i inställningar och klaga hos en myndighet. Mejla oss.</p><h2>7. Endast vuxna och ändringar</h2><p>Appen är endast för personer över 18 år. Vi erbjuder den inte medvetet till barn och samlar inte medvetet in deras data. Ändringar publiceras här med nytt datum.</p>`},
ru:{title:'Политика конфиденциальности',label:'Язык',updated:'Последнее обновление:',terms:'Условия использования',support:'Поддержка',html:`<p>Эта Политика объясняет, как JDG Nazar Dzys, работающий под именем NV Softlab («мы»), обрабатывает информацию в мобильном приложении <strong>Truth or Dare</strong> («Приложение»).</p><h2>1. Оператор и контакты</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Польша<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Данные на устройстве</h2><p>Имена игроков, настройки, язык, прогресс, уведомления, тексты и названия собственных колод и карточек хранятся локально. Приложение не загружает этот контент нам. Он удаляется при отдельном удалении или при удалении/очистке данных Приложения.</p><h2>3. Сервисы и данные</h2><p>Firebase обеспечивает анонимную аутентификацию и, только с согласия, аналитику. AppsFlyer обеспечивает необязательную атрибуцию установок. Они могут обрабатывать анонимный ID, устройство/ОС, версию, язык и события использования. Мы не отправляем в аналитику имена игроков, собственные названия или ID и текст собственных карточек.</p><p>RevenueCat и Apple App Store или Google Play обрабатывают ID продукта, статус покупки, подписки и доступа, транзакцию, страну и валюту. Полные данные карты мы не получаем. Для поддержки обрабатываем ваш e-mail и сообщение.</p><h2>4. Выбор, цели и правовые основания</h2><p>Аналитика и атрибуция по умолчанию отключены. Их можно включить или отозвать согласие в Настройки → Делиться анонимными данными об использовании без ограничения Приложения. Основания: согласие, договор, законный интерес в безопасности и юридические обязанности.</p><h2>5. Поставщики, передача и хранение</h2><p>Мы используем <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple и Google. Они должны защищать данные по этой Политике и закону. Передача за пределы ЕЭЗ использует надлежащие гарантии. Данные хранятся лишь столько, сколько нужно для аналитики, покупок, налогов, поддержки или закона.</p><h2>6. Ваши права</h2><p>По закону вы можете запросить доступ, исправление, удаление, ограничение, переносимость или возразить, отозвать согласие в настройках и пожаловаться регулятору. Напишите нам.</p><h2>7. Только для взрослых и изменения</h2><p>Приложение предназначено только для лиц от 18 лет. Мы сознательно не предлагаем его детям и не собираем их данные. Изменения публикуются здесь с новой датой.</p>`},
da:{title:'Privatlivspolitik',label:'Sprog',updated:'Senest opdateret:',terms:'Brugsvilkår',support:'Support',html:`<p>Denne politik forklarer, hvordan JDG Nazar Dzys, der driver NV Softlab (”vi”), behandler oplysninger i mobilappen <strong>Truth or Dare</strong> (”Appen”).</p><h2>1. Dataansvarlig og kontakt</h2><p>JDG Nazar Dzys<br>Generała Józefa Kustronia 20/6, 52-213, Wrocław, Polen<br><a href="mailto:nvsoftlab@gmail.com">nvsoftlab@gmail.com</a></p><h2>2. Data på enheden</h2><p>Spillernavne, indstillinger, sprog, fremskridt, notifikationer samt tekst og navne på egne kortsæt og kort gemmes lokalt. Appen uploader ikke indholdet til os. Det fjernes, når du sletter det eller afinstallerer/rydder Appens data.</p><h2>3. Tjenester og data</h2><p>Firebase leverer anonym godkendelse og kun med samtykke analyse. AppsFlyer leverer valgfri installationsattribuering. De kan behandle anonymt ID, enhed/OS, version, sprog og brugshændelser. Vi sender ikke spillernavne, egne navne eller ID’er eller egen korttekst til analyse.</p><p>RevenueCat og Apple App Store eller Google Play behandler produkt-ID, køb, abonnement, rettighed, transaktion, land og valuta. Vi modtager aldrig fulde kortoplysninger. Til support behandler vi din e-mail og besked.</p><h2>4. Valg, formål og retsgrundlag</h2><p>Analyse og attribuering er slået fra som standard. Du kan slå dem til eller trække samtykke tilbage under Indstillinger → Del anonyme brugsdata uden at begrænse Appen. Grundlagene er samtykke, kontrakt, legitim sikkerhedsinteresse og retlige pligter.</p><h2>5. Leverandører, overførsel og opbevaring</h2><p>Vi bruger <a href="https://firebase.google.com/support/privacy">Google Firebase</a>, <a href="https://www.appsflyer.com/legal/privacy-policy/">AppsFlyer</a>, <a href="https://www.revenuecat.com/privacy/">RevenueCat</a>, Apple og Google. De skal beskytte data efter denne politik og loven. Overførsel uden for EØS bruger passende garantier. Data gemmes kun så længe, som analyse, køb, skat, support eller lov kræver.</p><h2>6. Dine rettigheder</h2><p>Efter loven kan du bede om indsigt, rettelse, sletning, begrænsning, portabilitet eller gøre indsigelse, trække samtykke tilbage i indstillinger og klage til en myndighed. Send os en e-mail.</p><h2>7. Kun voksne og ændringer</h2><p>Appen er kun for personer på 18 år eller derover. Vi tilbyder den ikke bevidst til børn og indsamler ikke bevidst deres data. Ændringer offentliggøres her med ny dato.</p>`}

function locale(){const q=new URLSearchParams(location.search).get('lang');if(copy[q])return q;const raw=(navigator.language||'en').replace('-','_');return copy[raw]?raw:(copy[raw.split('_')[0]]?raw.split('_')[0]:'en')}
function show(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang.replace('_','-');document.title=`${c.title} — Truth or Dare`;document.getElementById('title').textContent=c.title;document.getElementById('language-label').textContent=c.label;document.getElementById('updated-label').textContent=c.updated;document.getElementById('content').innerHTML=c.html;const terms=document.getElementById('terms');const support=document.getElementById('support');terms.textContent=c.terms;support.textContent=c.support;terms.href=`../terms-of-use/?lang=${encodeURIComponent(lang)}`;support.href=`../support/?lang=${encodeURIComponent(lang)}`;select.value=lang;const u=new URL(location);u.searchParams.set('lang',lang);history.replaceState({},'',u)}
select.addEventListener('change',()=>show(select.value));show(locale());
